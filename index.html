<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pardna Portal</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#e8e0d4;font-family:monospace;min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState}=React;

function Login({onLogin}){
  const[pin,setPin]=useState("");
  const[err,setErr]=useState("");
  const submit=()=>{
    if(pin==="1234"){onLogin("admin");}
    else if(pin==="0000"){onLogin("member");}
    else{setErr("Wrong PIN. Try again.");}
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#111"}}>
      <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:16,padding:"40px 32px",width:"100%",maxWidth:340,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:12}}>💰</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:4}}>Pardna Portal</div>
        <div style={{fontSize:11,color:"#555",marginBottom:28}}>3200 Group · 9 Members</div>
        <input
          type="password"
          placeholder="Enter PIN"
          value={pin}
          onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&submit()}
          style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"12px 14px",color:"#e8e0d4",fontFamily:"monospace",fontSize:16,textAlign:"center",marginBottom:10,outline:"none"}}
        />
        {err&&<div style={{fontSize:11,color:"#a83232",marginBottom:10}}>{err}</div>}
        <button
          onClick={submit}
          style={{width:"100%",background:"rgba(201,123,46,0.2)",border:"1px solid rgba(201,123,46,0.4)",borderRadius:8,padding:"12px",color:"#c97b2e",fontFamily:"monospace",fontSize:13,cursor:"pointer",fontWeight:600}}>
          Enter
        </button>
        <div style={{fontSize:10,color:"#333",marginTop:20}}>Admin PIN: 1234 · Member PIN: 0000</div>
      </div>
    </div>
  );
}

const MEMBERS=[
  {id:1,name:"Veronica",hand:null},
  {id:2,name:"Brittany",hand:null},
  {id:3,name:"Michael", hand:null},
  {id:4,name:"Bobby",   hand:27},
  {id:5,name:"James",   hand:26},
  {id:6,name:"Anthony", hand:null},
  {id:7,name:"Tricia",  hand:null},
  {id:8,name:"Barbara", hand:null},
  {id:9,name:"Edwin",   hand:null},
];
const AVCOLS=["#C97B2E","#2E7D6E","#7B3F8C","#2E5F9B","#A83232","#5B8A2E","#8C5B2E","#2E7B8C","#7B6A2E"];
const START=new Date("2025-06-13");
const NWEEKS=32;

function genWeeks(){
  return Array.from({length:NWEEKS},(_,i)=>{
    const d=new Date(START);d.setDate(d.getDate()+i*7);
    return{n:i+1,date:d.toLocaleDateString("en-US",{month:"short",day:"numeric"}),full:d};
  });
}
const WEEKS=genWeeks();

function initPay(){
  const p={};
  MEMBERS.forEach(m=>{p[m.id]={};WEEKS.forEach(w=>{p[m.id][w.n]=false;});});
  return p;
}

function getCurWeek(){
  const t=new Date();let c=0;
  WEEKS.forEach(w=>{if(t>=w.full)c=w.n;});
  return Math.max(1,c);
}

function Av({name,idx,size=36}){
  const c=AVCOLS[idx%AVCOLS.length];
  return<div style={{width:size,height:size,borderRadius:"50%",background:c+"28",border:`1.5px solid ${c}55`,color:c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.38,fontWeight:700,flexShrink:0}}>{name[0]}</div>;
}
function HBadge({hand}){
  return hand
    ?<span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:"rgba(201,123,46,.15)",color:"#c97b2e",border:"1px solid rgba(201,123,46,.3)",fontWeight:600}}>Hand #{hand}</span>
    :<span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:"rgba(255,255,255,.05)",color:"#555",border:"1px solid #2a2a2a"}}>Unassigned</span>;
}

function App(){
  const[role,setRole]=useState(null);
  const[pay,setPay]=useState(initPay);
  const[tab,setTab]=useState("overview");
  const[fmem,setFmem]=useState(null);
  const cw=React.useMemo(getCurWeek,[]);
  const admin=role==="admin";

  if(!role)return<Login onLogin={setRole}/>;

  const stats=MEMBERS.map((m,i)=>{
    const paid=WEEKS.filter(w=>w.n<=cw&&pay[m.id][w.n]).length;
    const due=Math.min(cw,NWEEKS);
    return{...m,idx:i,paid,due,arr:due-paid,amt:paid*100};
  });

  const totCol=stats.reduce((s,m)=>s+m.amt,0);
  const totArr=stats.reduce((s,m)=>s+m.arr,0);
  const health=Math.round((stats.reduce((s,m)=>s+m.paid,0)/(MEMBERS.length*cw))*100);
  const potMap={};MEMBERS.forEach(m=>{if(m.hand)potMap[m.hand]=m;});

  const toggle=(mid,wn)=>{
    if(!admin)return;
    setPay(p=>({...p,[mid]:{...p[mid],[wn]:!p[mid][wn]}}));
  };

  const card=(label,val,sub,color)=>(
    <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"14px 18px",flex:1,minWidth:120}}>
      <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:5}}>{label}</div>
      <div style={{fontSize:24,fontWeight:700,lineHeight:1,color:color||"#e8e0d4"}}>{val}</div>
      {sub&&<div style={{fontSize:10,color:"#555",marginTop:4}}>{sub}</div>}
    </div>
  );

  const Overview=()=>(
    <div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:24}}>
        {card("Pot Size","$3,200",null,"#c97b2e")}
        {card("Collected",`$${totCol.toLocaleString()}`,`Week ${cw} of ${NWEEKS}`)}
        {card("Health",`${health}%`,null,health>=80?"#2e7d6e":health>=60?"#c97b2e":"#a83232")}
        {card("Arrears",totArr,"payments behind",totArr>0?"#a83232":"#2e7d6e")}
      </div>
      <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:10}}>Members</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:10}}>
        {stats.map(m=>(
          <div key={m.id} onClick={()=>{setFmem(m.id);setTab("payments");}}
            style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"13px 15px",display:"flex",alignItems:"center",gap:11,cursor:"pointer"}}>
            <Av name={m.name} idx={m.idx}/>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>{m.name}</span><HBadge hand={m.hand}/></div>
              <div style={{background:"#2a2a2a",borderRadius:4,height:4,overflow:"hidden"}}>
                <div style={{width:`${m.due>0?(m.paid/m.due)*100:0}%`,height:"100%",background:m.arr>0?"#a83232":"#2e7d6e",borderRadius:4}}/>
              </div>
              <div style={{fontSize:10,color:"#555",marginTop:4,display:"flex",justifyContent:"space-between"}}>
                <span>{m.paid}/{m.due} paid</span>
                <span style={{color:m.arr>0?"#a83232":"#2e7d6e"}}>{m.arr>0?`${m.arr} behind`:"✓ current"}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const Schedule=()=>(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:8}}>
      {WEEKS.map(w=>{
        const rec=potMap[w.n];
        const past=w.n<cw,cur=w.n===cw;
        const midx=rec?MEMBERS.findIndex(m=>m.id===rec.id):-1;
        return(
          <div key={w.n} style={{background:cur?"rgba(201,123,46,.08)":"#1c1c1c",border:`1px solid ${cur?"rgba(201,123,46,.35)":"#2a2a2a"}`,borderRadius:10,padding:"12px 14px",opacity:past&&!cur?.55:1}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:10,color:"#555"}}>Wk {w.n}</span>
              {cur&&<span style={{fontSize:9,color:"#c97b2e",background:"rgba(201,123,46,.15)",padding:"1px 6px",borderRadius:10}}>NOW</span>}
              {past&&!cur&&<span style={{fontSize:9,color:"#444"}}>past</span>}
            </div>
            <div style={{fontSize:11,color:"#666",marginBottom:8}}>{w.date}</div>
            {rec
              ?<div style={{display:"flex",alignItems:"center",gap:8}}><Av name={rec.name} idx={midx} size={26}/><div><div style={{fontSize:12,fontWeight:600}}>{rec.name}</div><div style={{fontSize:10,color:"#c97b2e"}}>$3,200</div></div></div>
              :<div style={{fontSize:11,color:"#333",fontStyle:"italic"}}>Unassigned</div>
            }
          </div>
        );
      })}
    </div>
  );

  const Payments=()=>{
    const show=fmem?stats.filter(m=>m.id===fmem):stats;
    return(
      <div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:16,alignItems:"center"}}>
          <span style={{fontSize:11,color:"#555"}}>Filter:</span>
          <button onClick={()=>setFmem(null)} style={{background:!fmem?"rgba(201,123,46,.12)":"none",border:`1px solid ${!fmem?"rgba(201,123,46,.45)":"#2a2a2a"}`,borderRadius:20,color:!fmem?"#c97b2e":"#555",cursor:"pointer",fontFamily:"monospace",fontSize:11,padding:"4px 11px"}}>All</button>
          {stats.map(m=><button key={m.id} onClick={()=>setFmem(fmem===m.id?null:m.id)} style={{background:fmem===m.id?"rgba(201,123,46,.12)":"none",border:`1px solid ${fmem===m.id?"rgba(201,123,46,.45)":"#2a2a2a"}`,borderRadius:20,color:fmem===m.id?"#c97b2e":"#555",cursor:"pointer",fontFamily:"monospace",fontSize:11,padding:"4px 11px"}}>{m.name}</button>)}
        </div>
        {!admin&&<div style={{background:"rgba(46,125,110,.1)",border:"1px solid rgba(46,125,110,.25)",borderRadius:8,padding:"8px 14px",fontSize:11,color:"#2e7d6e",marginBottom:14}}>View-only mode.</div>}
        {show.map(m=>(
          <div key={m.id} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:14}}>
              <Av name={m.name} idx={m.idx}/>
              <div>
                <div style={{fontSize:14,fontWeight:600,display:"flex",gap:8,alignItems:"center"}}>{m.name}<HBadge hand={m.hand}/></div>
                <div style={{fontSize:11,color:"#555",marginTop:3}}>{m.paid} paid · <span style={{color:m.arr>0?"#a83232":"#2e7d6e"}}>{m.arr>0?`${m.arr} behind`:"current"}</span> · ${m.amt.toLocaleString()}</div>
              </div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {WEEKS.map(w=>{
                const paid=pay[m.id][w.n],due=w.n<=cw,cur=w.n===cw;
                return<div key={w.n} title={`Week ${w.n} · ${w.date}`} onClick={()=>due&&toggle(m.id,w.n)}
                  style={{width:34,height:34,borderRadius:8,fontSize:10,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",
                    border:`1.5px solid ${cur?"rgba(201,123,46,.6)":paid?"rgba(46,125,110,.4)":due?"rgba(168,50,50,.35)":"#2a2a2a"}`,
                    background:paid?"rgba(46,125,110,.2)":due?"rgba(168,50,50,.18)":"#161616",
                    color:paid?"#2e7d6e":due?"#a83232":"#333",
                    cursor:due&&admin?"pointer":"default"}}>
                  {w.n}
                </div>;
              })}
            </div>
          </div>
        ))}
      </div>
    );
  };

  return(
    <div style={{minHeight:"100vh",background:"#111"}}>
      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:700}}>💰 3200 Pardna</div>
          <div style={{fontSize:10,color:"#555",marginTop:2}}>Jun 13 2025 → Jan 16 2026</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{background:"rgba(201,123,46,.15)",color:"#c97b2e",border:"1px solid rgba(201,123,46,.3)",borderRadius:20,padding:"4px 12px",fontSize:11}}>Week {cw}</span>
          <button onClick={()=>setRole(null)} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:8,color:"#555",cursor:"pointer",fontFamily:"monospace",fontSize:11,padding:"4px 10px"}}>Logout</button>
        </div>
      </div>
      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",display:"flex",padding:"0 20px",overflowX:"auto"}}>
        {["overview","schedule","payments","members"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{background:"none",border:"none",borderBottom:`2px solid ${tab===t?"#c97b2e":"transparent"}`,color:tab===t?"#c97b2e":"#555",cursor:"pointer",fontFamily:"monospace",fontSize:12,padding:"12px 14px",whiteSpace:"nowrap"}}>
            {t}
          </button>
        ))}
      </div>
      <div style={{padding:20,maxWidth:960,margin:"0 auto"}}>
        {tab==="overview"&&<Overview/>}
        {tab==="schedule"&&<Schedule/>}
        {tab==="payments"&&<Payments/>}
        {tab==="members"&&(
          <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,overflow:"hidden"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 80px 90px 70px 80px 75px",padding:"10px 18px",borderBottom:"1px solid #2a2a2a",fontSize:10,color:"#555",textTransform:"uppercase"}}>
              <span>Member</span><span>Hand</span><span>Draw</span><span>Paid</span><span>Collected</span><span>Status</span>
            </div>
            {stats.map(m=>{
              const dw=m.hand?WEEKS[m.hand-1]:null;
              return(
                <div key={m.id} style={{display:"grid",gridTemplateColumns:"1fr 80px 90px 70px 80px 75px",padding:"12px 18px",alignItems:"center",borderBottom:"1px solid #1a1a1a"}}>
                  <div style={{display:"flex",alignItems:"center",gap:9}}><Av name={m.name} idx={m.idx} size={30}/><span style={{fontSize:13}}>{m.name}</span></div>
                  <HBadge hand={m.hand}/>
                  <span style={{fontSize:11,color:"#666"}}>{dw?dw.date:"—"}</span>
                  <span style={{fontSize:13}}>{m.paid}<span style={{color:"#444"}}>/{m.due}</span></span>
                  <span style={{fontSize:13,color:"#c97b2e"}}>${m.amt.toLocaleString()}</span>
                  <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:m.arr>0?"rgba(168,50,50,.15)":"rgba(46,125,110,.15)",color:m.arr>0?"#a83232":"#2e7d6e",border:`1px solid ${m.arr>0?"rgba(168,50,50,.3)":"rgba(46,125,110,.3)"}`}}>
                    {m.arr>0?`${m.arr} behind`:"current"}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
