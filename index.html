<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3200 Pardna Portal</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#e8e0d4;font-family:monospace;min-height:100vh}
header{background:#181818;border-bottom:1px solid #2a2a2a;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.gname{font-size:16px;font-weight:700}.gsub{font-size:10px;color:#555;margin-top:2px}
.wbadge{background:rgba(201,123,46,.15);color:#c97b2e;border:1px solid rgba(201,123,46,.3);border-radius:20px;padding:4px 12px;font-size:11px}
.trow{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11px}
.ttrack{width:34px;height:18px;border-radius:9px;background:#333;position:relative;transition:background .2s}
.ttrack.on{background:rgba(201,123,46,.5)}
.tthumb{width:12px;height:12px;border-radius:50%;background:#555;position:absolute;top:3px;left:3px;transition:all .2s}
.ttrack.on .tthumb{left:19px;background:#c97b2e}
nav{background:#181818;border-bottom:1px solid #2a2a2a;display:flex;padding:0 20px;overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:#555;cursor:pointer;font-family:monospace;font-size:12px;padding:12px 14px;transition:color .15s;white-space:nowrap}
nav button.active{color:#c97b2e;border-bottom-color:#c97b2e}
main{padding:20px;max-width:960px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.scard{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:12px;padding:14px 18px;flex:1;min-width:120px}
.slabel{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.sval{font-size:24px;font-weight:700;line-height:1}
.ssub{font-size:10px;color:#555;margin-top:4px}
.sec{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mcard{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .15s}
.mcard:hover{border-color:rgba(201,123,46,.4)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.minfo{flex:1}
.mnrow{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.mn{font-size:13px;font-weight:600}
.hbadge{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(201,123,46,.15);color:#c97b2e;border:1px solid rgba(201,123,46,.3);font-weight:600}
.ubadge{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.05);color:#555;border:1px solid #2a2a2a}
.pbar{background:#2a2a2a;border-radius:4px;height:4px;overflow:hidden}
.pfill{height:100%;border-radius:4px;transition:width .3s}
.mmeta{font-size:10px;color:#555;margin-top:4px;display:flex;justify-content:space-between}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.wcard{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:10px;padding:12px 14px}
.wcard.cur{background:rgba(201,123,46,.08);border-color:rgba(201,123,46,.35)}
.wcard.past{opacity:.55}
.wtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wnum{font-size:10px;color:#555}
.nowb{font-size:9px;color:#c97b2e;background:rgba(201,123,46,.15);padding:1px 6px;border-radius:10px}
.pastb{font-size:9px;color:#444}
.wdate{font-size:11px;color:#666;margin-bottom:8px}
.wrec{display:flex;align-items:center;gap:8px}
.wrecname{font-size:12px;font-weight:600}
.wpot{font-size:10px;color:#c97b2e}
.wempty{font-size:11px;color:#333;font-style:italic}
.fbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.flabel{font-size:11px;color:#555}
.fbtn{background:none;border:1px solid #2a2a2a;border-radius:20px;color:#555;cursor:pointer;font-family:monospace;font-size:11px;padding:4px 11px;transition:all .15s}
.fbtn.active{background:rgba(201,123,46,.12);border-color:rgba(201,123,46,.45);color:#c97b2e}
.anote{background:rgba(46,125,110,.1);border:1px solid rgba(46,125,110,.25);border-radius:8px;padding:8px 14px;font-size:11px;color:#2e7d6e;margin-bottom:14px}
.pblock{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:14px;padding:18px 20px;margin-bottom:12px}
.phead{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.pmname{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.pmeta{font-size:11px;color:#555;margin-top:3px}
.tiles{display:flex;flex-wrap:wrap;gap:5px}
.tile{width:34px;height:34px;border-radius:8px;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1.5px solid #2a2a2a;background:#161616;color:#333;transition:all .12s}
.tile.paid{background:rgba(46,125,110,.2);border-color:rgba(46,125,110,.4);color:#2e7d6e}
.tile.unpaid{background:rgba(168,50,50,.18);border-color:rgba(168,50,50,.35);color:#a83232}
.tile.cwk{border-color:rgba(201,123,46,.6)!important}
.tile.click{cursor:pointer}.tile.click:hover{transform:scale(1.1)}
.leg{display:flex;gap:14px;margin-top:10px;font-size:10px;color:#555}
.mtable{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden}
.mth{display:grid;grid-template-columns:1fr 85px 95px 80px 85px 80px;padding:10px 18px;border-bottom:1px solid #2a2a2a;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.5px}
.mtr{display:grid;grid-template-columns:1fr 85px 95px 80px 85px 80px;padding:12px 18px;align-items:center;border-bottom:1px solid #1a1a1a;transition:background .12s}
.mtr:last-child{border-bottom:none}
.mtr:hover{background:rgba(255,255,255,.02)}
.stbadge{font-size:10px;padding:2px 8px;border-radius:20px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const MEMBERS = [
  {id:1,name:"Veronica",hand:null},
  {id:2,name:"Brittany",hand:null},
  {id:3,name:"Michael", hand:null},
  {id:4,name:"Bobby",   hand:27},
  {id:5,name:"James",   hand:26},
  {id:6,name:"Anthony", hand:null},
  {id:7,name:"Tricia",  hand:null},
  {id:8,name:"Barbara", hand:null},
  {id:9,name:"Edwin",   hand:null},
];
const AVCOLS=["#C97B2E","#2E7D6E","#7B3F8C","#2E5F9B","#A83232","#5B8A2E","#8C5B2E","#2E7B8C","#7B6A2E"];
const START=new Date("2025-06-13");
const NWEEKS=32;

function genWeeks(){
  return Array.from({length:NWEEKS},(_,i)=>{
    const d=new Date(START); d.setDate(d.getDate()+i*7);
    return {n:i+1,date:d.toLocaleDateString("en-US",{month:"short",day:"numeric"}),full:d};
  });
}
const WEEKS=genWeeks();

function initPay(){
  const p={};
  MEMBERS.forEach(m=>{p[m.id]={};WEEKS.forEach(w=>{p[m.id][w.n]=false;});});
  return p;
}

function getCurWeek(){
  const t=new Date(); let c=0;
  WEEKS.forEach(w=>{if(t>=w.full)c=w.n;});
  return Math.max(1,c);
}

function Av({name,idx,size=36}){
  const c=AVCOLS[idx%AVCOLS.length];
  return <div className="av" style={{width:size,height:size,background:c+"28",border:`1.5px solid ${c}55`,color:c}}>{name[0]}</div>;
}
function HBadge({hand}){
  return hand
    ? <span className="hbadge">Hand #{hand}</span>
    : <span className="ubadge">Unassigned</span>;
}

export default function App(){
  const [pay,setPay]=useState(initPay);
  const [tab,setTab]=useState("overview");
  const [admin,setAdmin]=useState(true);
  const [fmem,setFmem]=useState(null);
  const cw=useMemo(getCurWeek,[]);

  const stats=useMemo(()=>MEMBERS.map((m,i)=>{
    const paid=WEEKS.filter(w=>w.n<=cw&&pay[m.id][w.n]).length;
    const due=Math.min(cw,NWEEKS);
    return{...m,idx:i,paid,due,arr:due-paid,amt:paid*100};
  }),[pay,cw]);

  const totCol=stats.reduce((s,m)=>s+m.amt,0);
  const totArr=stats.reduce((s,m)=>s+m.arr,0);
  const health=Math.round((stats.reduce((s,m)=>s+m.paid,0)/(MEMBERS.length*cw))*100);
  const potMap=useMemo(()=>{const x={};MEMBERS.forEach(m=>{if(m.hand)x[m.hand]=m;});return x;},[]);

  const toggle=(mid,wn)=>{
    if(!admin)return;
    setPay(p=>({...p,[mid]:{...p[mid],[wn]:!p[mid][wn]}}));
  };

  const SC=({label,val,sub,color})=>(
    <div className="scard">
      <div className="slabel">{label}</div>
      <div className="sval" style={{color:color||"#e8e0d4"}}>{val}</div>
      {sub&&<div className="ssub">{sub}</div>}
    </div>
  );

  const Overview=()=>(
    <div>
      <div className="stats">
        <SC label="Pot Size" val="$3,200" color="#c97b2e"/>
        <SC label="Collected" val={`$${totCol.toLocaleString()}`} sub={`Week ${cw} of ${NWEEKS}`}/>
        <SC label="Health" val={`${health}%`} color={health>=80?"#2e7d6e":health>=60?"#c97b2e":"#a83232"}/>
        <SC label="Arrears" val={totArr} sub="payments behind" color={totArr>0?"#a83232":"#2e7d6e"}/>
      </div>
      <div className="sec">Members</div>
      <div className="mgrid">
        {stats.map(m=>(
          <div key={m.id} className="mcard" onClick={()=>{setFmem(m.id);setTab("payments");}}>
            <Av name={m.name} idx={m.idx}/>
            <div className="minfo">
              <div className="mnrow"><span className="mn">{m.name}</span><HBadge hand={m.hand}/></div>
              <div className="pbar"><div className="pfill" style={{width:`${m.due>0?(m.paid/m.due)*100:0}%`,background:m.arr>0?"#a83232":"#2e7d6e"}}/></div>
              <div className="mmeta">
                <span>{m.paid}/{m.due} paid</span>
                <span style={{color:m.arr>0?"#a83232":"#2e7d6e"}}>{m.arr>0?`${m.arr} behind`:"✓ current"}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const Schedule=()=>(
    <div>
      <div className="sec" style={{marginBottom:14}}>Pot Draw Schedule — {NWEEKS} Weeks</div>
      <div className="sgrid">
        {WEEKS.map(w=>{
          const rec=potMap[w.n];
          const past=w.n<cw, cur=w.n===cw;
          const midx=rec?MEMBERS.findIndex(m=>m.id===rec.id):-1;
          return(
            <div key={w.n} className={`wcard${cur?" cur":""}${past&&!cur?" past":""}`}>
              <div className="wtop">
                <span className="wnum">Wk {w.n}</span>
                {cur&&<span className="nowb">NOW</span>}
                {past&&!cur&&<span className="pastb">past</span>}
              </div>
              <div className="wdate">{w.date}</div>
              {rec
                ?<div className="wrec"><Av name={rec.name} idx={midx} size={26}/><div><div className="wrecname">{rec.name}</div><div className="wpot">$3,200</div></div></div>
                :<div className="wempty">Unassigned</div>
              }
            </div>
          );
        })}
      </div>
    </div>
  );

  const Payments=()=>{
    const show=fmem?stats.filter(m=>m.id===fmem):stats;
    return(
      <div>
        <div className="fbar">
          <span className="flabel">Filter:</span>
          <button className={`fbtn${!fmem?" active":""}`} onClick={()=>setFmem(null)}>All</button>
          {stats.map(m=><button key={m.id} className={`fbtn${fmem===m.id?" active":""}`} onClick={()=>setFmem(fmem===m.id?null:m.id)}>{m.name}</button>)}
        </div>
        {!admin&&<div className="anote">View-only. Enable Admin to toggle payments.</div>}
        {show.map(m=>(
          <div key={m.id} className="pblock">
            <div className="phead">
              <Av name={m.name} idx={m.idx}/>
              <div>
                <div className="pmname">{m.name}<HBadge hand={m.hand}/></div>
                <div className="pmeta">{m.paid} paid · <span style={{color:m.arr>0?"#a83232":"#2e7d6e"}}>{m.arr>0?`${m.arr} behind`:"current"}</span> · ${m.amt.toLocaleString()} collected</div>
              </div>
            </div>
            <div className="tiles">
              {WEEKS.map(w=>{
                const paid=pay[m.id][w.n];
                const due=w.n<=cw, cur=w.n===cw;
                return(
                  <div key={w.n}
                    className={`tile${paid?" paid":due?" unpaid":""}${cur?" cwk":""}${due&&admin?" click":""}`}
                    title={`Week ${w.n} · ${w.date}`}
                    onClick={()=>due&&toggle(m.id,w.n)}>
                    {w.n}
                  </div>
                );
              })}
            </div>
            <div className="leg">
              <span><span style={{color:"#2e7d6e"}}>■</span> Paid</span>
              <span><span style={{color:"#a83232"}}>■</span> Unpaid</span>
              <span><span style={{color:"#333"}}>■</span> Upcoming</span>
            </div>
          </div>
        ))}
      </div>
    );
  };

  const Members=()=>(
    <div>
      <div className="sec" style={{marginBottom:14}}>9 Members · $100/week · $3,200 pot</div>
      <div className="mtable">
        <div className="mth"><span>Member</span><span>Hand</span><span>Draw Date</span><span>Paid</span><span>Collected</span><span>Status</span></div>
        {stats.map((m,i)=>{
          const dw=m.hand?WEEKS[m.hand-1]:null;
          return(
            <div key={m.id} className="mtr">
              <div style={{display:"flex",alignItems:"center",gap:9}}><Av name={m.name} idx={m.idx} size={30}/><span style={{fontSize:13,fontWeight:500}}>{m.name}</span></div>
              <div><HBadge hand={m.hand}/></div>
              <div style={{fontSize:11,color:dw?"#888":"#444"}}>{dw?dw.date:"—"}</div>
              <div style={{fontSize:13}}>{m.paid}<span style={{color:"#444"}}>/{m.due}</span></div>
              <div style={{fontSize:13,color:"#c97b2e"}}>${m.amt.toLocaleString()}</div>
              <div className="stbadge" style={{background:m.arr>0?"rgba(168,50,50,.15)":"rgba(46,125,110,.15)",color:m.arr>0?"#a83232":"#2e7d6e",border:`1px solid ${m.arr>0?"rgba(168,50,50,.3)":"rgba(46,125,110,.3)"}`}}>
                {m.arr>0?`${m.arr} behind`:"current"}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  return(
    <div>
      <header>
        <div>
          <div className="gname">💰 3200 Pardna</div>
          <div className="gsub">Jun 13 2025 → Jan 16 2026 · 9 members · 32 weeks</div>
          <div className="trow" onClick={()=>setAdmin(a=>!a)}>
            <div className={`ttrack${admin?" on":""}`}><div className="tthumb"/></div>
            <span style={{color:admin?"#c97b2e":"#555"}}>Admin Mode</span>
          </div>
        </div>
        <div className="wbadge">Week {cw}</div>
      </header>
      <nav>
        {["overview","schedule","payments","members"].map(t=>(
          <button key={t} className={tab===t?"active":""} onClick={()=>setTab(t)}>{t}</button>
        ))}
      </nav>
      <main>
        {tab==="overview"&&<Overview/>}
        {tab==="schedule"&&<Schedule/>}
        {tab==="payments"&&<Payments/>}
        {tab==="members"&&<Members/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
