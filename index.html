// ── SECURITY ───────────────────────────────────────────────────────────
const SESSION_TIMEOUT=30*60*1000; // 30 minutes
const MAX_ATTEMPTS=5;
const LOCKOUT_TIME=5*60*1000; // 5 minutes

// In-memory security store (resets on page refresh — intentional)
const secStore={
  attempts:{},   // {key: count}
  lockouts:{},   // {key: timestamp}
  session:null,  // {role, member, token, expires}
};

function genToken(){
  return Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function getLockoutKey(name){return`lockout_${name.toLowerCase()}`;}

function isLockedOut(name){
  const key=getLockoutKey(name);
  const lockTime=secStore.lockouts[key];
  if(!lockTime)return false;
  if(Date.now()-lockTime>LOCKOUT_TIME){
    delete secStore.lockouts[key];
    delete secStore.attempts[key];
    return false;
  }
  return true;
}

function getLockoutRemaining(name){
  const key=getLockoutKey(name);
  const lockTime=secStore.lockouts[key];
  if(!lockTime)return 0;
  const remaining=LOCKOUT_TIME-(Date.now()-lockTime);
  return Math.max(0,Math.ceil(remaining/1000));
}

function recordFailedAttempt(name){
  const key=getLockoutKey(name);
  secStore.attempts[key]=(secStore.attempts[key]||0)+1;
  if(secStore.attempts[key]>=MAX_ATTEMPTS){
    secStore.lockouts[key]=Date.now();
  }
  return MAX_ATTEMPTS-secStore.attempts[key];
}

function clearAttempts(name){
  const key=getLockoutKey(name);
  delete secStore.attempts[key];
  delete secStore.lockouts[key];
}

function createSession(role,member){
  const token=genToken();
  secStore.session={role,member,token,expires:Date.now()+SESSION_TIMEOUT};
  return token;
}

function validateSession(token){
  if(!secStore.session)return null;
  if(secStore.session.token!==token)return null;
  if(Date.now()>secStore.session.expires)return null;
  return secStore.session;
}

function refreshSession(token){
  if(secStore.session&&secStore.session.token===token){
    secStore.session.expires=Date.now()+SESSION_TIMEOUT;
  }
}

function destroySession(){
  secStore.session=null;
}

// ── CONSTANTS ──────────────────────────────────────────────────────────
const AVCOLS=["#C97B2E","#2E7D6E","#7B3F8C","#2E5F9B","#A83232","#5B8A2E","#8C5B2E","#2E7B8C","#7B6A2E","#3A7B8C"];
const START=new Date("2025-06-13");
const NWEEKS=32;

function genWeeks(){
  return Array.from({length:NWEEKS},(_,i)=>{
    const d=new Date(START);d.setDate(d.getDate()+i*7);
    const draw=new Date(d);draw.setDate(draw.getDate()+1);
    return{n:i+1,date:d.toLocaleDateString("en-US",{month:"short",day:"numeric"}),drawDate:draw.toLocaleDateString("en-US",{month:"short",day:"numeric"}),full:d};
  });
}
const WEEKS=genWeeks();

function getCurWeek(){
  const t=new Date();let c=0;
  WEEKS.forEach(w=>{if(t>=w.full)c=w.n;});
  return Math.max(1,c);
}

function Av({name,idx,size=36}){
  const c=AVCOLS[idx%AVCOLS.length];
  return<div style={{width:size,height:size,borderRadius:"50%",background:c+"28",border:`1.5px solid ${c}55`,color:c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.4,fontWeight:700,flexShrink:0}}>{name[0]}</div>;
}

}

      <span style={{fontSize:12,color:"#c97b2e"}}>⏱ Session expires in {remaining}s</span>
      <button onClick={onExtend} style={{background:"rgba(201,123,46,.2)",border:"1px solid rgba(201,123,46,.4)",borderRadius:8,color:"#c97b2e",fontSize:11,padding:"4px 12px"}}>Stay Logged In</button>
    </div>
  );
}

function ChangePinForm({currentPin,onSave,onCancel}){
  const[cur,setCur]=useState("");
  const[n1,setN1]=useState("");
  const[n2,setN2]=useState("");
  const[err,setErr]=useState("");
  const[ok,setOk]=useState(false);
  const[saving,setSaving]=useState(false);

  const submit=async()=>{
    if(cur!==currentPin){setErr("Current PIN incorrect.");return;}
    if(n1.length<4){setErr("New PIN must be at least 4 digits.");return;}
    if(!/^\d+$/.test(n1)){setErr("PIN must be numbers only.");return;}
    if(n1!==n2){setErr("PINs don't match.");return;}
    if(n1===currentPin){setErr("New PIN must be different.");return;}
    setSaving(true);await onSave(n1);setSaving(false);setOk(true);
  };

  if(ok)return(
    <div style={{textAlign:"center",padding:"40px 20px"}}>
      <div style={{fontSize:28,marginBottom:12}}>✅</div>
      <div style={{fontWeight:600,marginBottom:8}}>PIN Updated</div>
      <div style={{fontSize:11,color:"#555",marginBottom:20}}>Saved successfully.</div>
      <button onClick={onCancel} style={{background:"rgba(46,125,110,.15)",border:"1px solid rgba(46,125,110,.35)",borderRadius:8,padding:"10px 24px",color:"#2e7d6e",fontSize:12}}>Done</button>
    </div>
  );

  return(
    <div style={{maxWidth:320,margin:"0 auto",padding:20}}>
      {[["Current PIN",cur,setCur],["New PIN",n1,setN1],["Confirm New PIN",n2,setN2]].map(([lbl,val,set])=>(
        <div key={lbl} style={{marginBottom:14}}>
          <div style={{fontSize:11,color:"#555",marginBottom:6}}>{lbl}</div>
          <input type="password" value={val} onChange={e=>set(e.target.value)}
            style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:14,textAlign:"center"}}/>
        </div>
      ))}
      {err&&<div style={{fontSize:11,color:"#a83232",marginBottom:12}}>{err}</div>}
      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel} style={{flex:1,background:"none",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px",color:"#555",fontSize:12}}>Cancel</button>
        <button onClick={submit} disabled={saving} style={{flex:1,background:"rgba(201,123,46,.2)",border:"1px solid rgba(201,123,46,.4)",borderRadius:8,padding:"10px",color:"#c97b2e",fontSize:12,fontWeight:600}}>
          {saving?"Saving...":"Save PIN"}
        </button>
      </div>
    </div>
  );
}

function Login({members,adminPin,onLogin}){
  const[name,setName]=useState("");
  const[pin,setPin]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const[locked,setLocked]=useState(false);
  const[countdown,setCountdown]=useState(0);

  useEffect(()=>{
    if(!locked)return;
    const interval=setInterval(()=>{
      const remaining=getLockoutRemaining(name);
      setCountdown(remaining);
      if(remaining<=0){setLocked(false);setErr("");}
    },1000);
    return()=>clearInterval(interval);
  },[locked,name]);

  const submit=async()=>{
    if(!name){setErr("Please select your name.");return;}
    if(isLockedOut(name)){
      setLocked(true);
      setCountdown(getLockoutRemaining(name));
      setErr(`Too many attempts. Try again in ${getLockoutRemaining(name)}s.`);
      return;
    }
    setLoading(true);setErr("");
    // Small delay to prevent timing attacks
    await new Promise(r=>setTimeout(r,300));
    if(name==="__admin__"&&pin===adminPin){
      clearAttempts("__admin__");
      onLogin("admin",null);
      return;
    }
    const m=members.find(m=>m.name.toLowerCase()===name.toLowerCase()&&m.pin===pin);
    if(m){
      clearAttempts(name);
      onLogin("member",m);
    } else {
      const remaining=recordFailedAttempt(name);
      if(isLockedOut(name)){
        setLocked(true);
        setCountdown(getLockoutRemaining(name));
        setErr(`Too many failed attempts. Locked for 5 minutes.`);
      } else {
        setErr(`Incorrect PIN. ${remaining} attempt${remaining!==1?"s":""} remaining.`);
      }
    }
    setLoading(false);
    setPin("");
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#111"}}>
      <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:16,padding:"40px 32px",width:"100%",maxWidth:340}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:32,marginBottom:10}}>💰</div>
          <div style={{fontSize:20,fontWeight:700}}>Pardna Portal</div>
          <div style={{fontSize:11,color:"#555",marginTop:4}}>3200 Group · 10 Members</div>
        </div>
        <div style={{fontSize:11,color:"#555",marginBottom:6}}>Your Name</div>
        <select value={name} onChange={e=>{setName(e.target.value);setErr("");setLocked(false);}}
          style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"11px 12px",color:name?"#e8e0d4":"#555",fontSize:13,marginBottom:12}}>
          <option value="">Select your name...</option>
          {members.map(m=><option key={m.id} value={m.name}>{m.name}</option>)}
          <option value="__admin__">Admin</option>
        </select>
        <div style={{fontSize:11,color:"#555",marginBottom:6}}>PIN</div>
        <input type="password" placeholder="Enter your PIN" value={pin}
          onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!locked&&submit()}
          disabled={locked}
          style={{width:"100%",background:"#111",border:`1px solid ${locked?"rgba(168,50,50,.4)":"#2a2a2a"}`,borderRadius:8,padding:"11px 12px",fontSize:15,textAlign:"center",marginBottom:10,opacity:locked?.6:1}}/>
        {locked&&(
          <div style={{background:"rgba(168,50,50,.1)",border:"1px solid rgba(168,50,50,.25)",borderRadius:8,padding:"10px",textAlign:"center",marginBottom:10}}>
            <div style={{fontSize:12,color:"#a83232",fontWeight:600}}>🔒 Account Locked</div>
            <div style={{fontSize:11,color:"#888",marginTop:4}}>Try again in {countdown} seconds</div>
          </div>
        )}
        {!locked&&err&&<div style={{fontSize:11,color:"#a83232",marginBottom:10,textAlign:"center"}}>{err}</div>}
        <button onClick={submit} disabled={loading||locked}
          style={{width:"100%",background:locked?"rgba(255,255,255,.05)":"rgba(201,123,46,.2)",border:`1px solid ${locked?"#2a2a2a":"rgba(201,123,46,.4)"}`,borderRadius:8,padding:12,color:locked?"#444":"#c97b2e",fontSize:13,fontWeight:600,opacity:locked?.6:1}}>
          {loading?"Verifying...":locked?"Locked":"Enter"}
        </button>
      </div>
    </div>
  );
}

function MemberView({member,payments,borrows,donations,borrowRequests,cw,onLogout,onPinSaved,onDonationUpdate,onBorrowRequest,sessionToken}){

  const activityRef=useRef(Date.now());

  // Session timeout tracking
  useEffect(()=>{
    const interval=setInterval(()=>{
      const sess=validateSession(sessionToken);
      if(!sess){onLogout();return;}
      const remaining=Math.ceil((sess.expires-Date.now())/1000);
      setSessionRemaining(remaining);
      if(remaining<=0)onLogout();
    },1000);
    return()=>clearInterval(interval);
  },[sessionToken]);

  // Activity detection — refresh session on interaction
  const handleActivity=useCallback(()=>{
    refreshSession(sessionToken);
    activityRef.current=Date.now();
  },[sessionToken]);

  const extendSession=()=>{
    refreshSession(sessionToken);
    setSessionRemaining(SESSION_TIMEOUT/1000);
  };

  const idx=member.id-1;
  const paid=WEEKS.filter(w=>w.n<=cw&&payments[w.n]).length;
  const due=Math.min(cw,NWEEKS);
  const arr=due-paid;
  const amt=paid*100;
  const drawWeek=member.hand?WEEKS[member.hand-1]:null;
  const eligibleBorrow=Math.floor(amt*0.5);
  const myBorrows=borrows.filter(b=>b.member_id===member.id);
  const myDonation=donations.find(d=>d.member_id===member.id);
  const donationAmt=myDonation?parseFloat(myDonation.amount):0;
  const adjustedDraw=3200-donationAmt;
  const myRequests=borrowRequests.filter(r=>r.member_id===member.id);
  const pendingRequest=myRequests.find(r=>r.status==="pending");
  const activeBorrow=myBorrows.find(b=>!b.repaid);

  const[donationInput,setDonationInput]=useState(donationAmt>0?String(donationAmt):"");

  const[donationMsg,setDonationMsg]=useState("");

  const[borrowReason,setBorrowReason]=useState("");
  const[borrowMsg,setBorrowMsg]=useState("");
  const[borrowSaving,setBorrowSaving]=useState(false);

  const saveDonation=async()=>{
    handleActivity();
    setDonationSaving(true);

    await onDonationUpdate(member.id,val,myDonation?.id);
    setDonationMsg(val===0?"Donation cleared.":"Donation saved!");
    setDonationSaving(false);
    setTimeout(()=>setDonationMsg(""),3000);

  const submitBorrowRequest=async()=>{
    handleActivity();
    const amt2=parseFloat(borrowAmt);

    if(amt2>eligibleBorrow){setBorrowMsg(`Max eligible is $${eligibleBorrow}.`);return;}
    if(activeBorrow){setBorrowMsg("You have an active unpaid borrow.");return;}
    if(pendingRequest){setBorrowMsg("You already have a pending request.");return;}
    setBorrowSaving(true);
    await onBorrowRequest(member.id,amt2,borrowReason);
    setBorrowMsg("Request submitted! Admin will review shortly.");
    setBorrowAmt("");setBorrowReason("");
    setBorrowSaving(false);
  };

  const saveMemberPin=async(newPin)=>{
    await SUPA.from("members").update({pin:newPin}).eq("id",member.id);
    onPinSaved(member.id,newPin);
  };

  return(
    <div style={{minHeight:"100vh",background:"#111"}} onClick={handleActivity} onKeyDown={handleActivity}>
      <SessionWarning remaining={sessionRemaining} onExtend={extendSession}/>
      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Av name={member.name} idx={idx}/>

            <div style={{fontSize:15,fontWeight:700}}>{member.name}</div>
            <div style={{fontSize:10,color:"#555",marginTop:2}}><HBadge hand={member.hand}/></div>
          </div>
        </div>
        <button onClick={onLogout} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:8,color:"#555",fontSize:11,padding:"4px 10px"}}>Logout</button>
      </div>

      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",display:"flex",padding:"0 20px",overflowX:"auto"}}>
        {["my","draw","borrow","donate","pin"].map(t=>(
          <button key={t} onClick={()=>{setSubTab(t);handleActivity();}} style={{background:"none",border:"none",borderBottom:`2px solid ${subTab===t?"#c97b2e":"transparent"}`,color:subTab===t?"#c97b2e":"#555",fontSize:12,padding:"12px 14px",whiteSpace:"nowrap"}}>
            {t==="my"?"My Payments":t==="draw"?"My Draw":t==="borrow"?"Borrow":t==="donate"?"Donate":"Change PIN"}
          </button>
        ))}
      </div>

      <div style={{padding:20,maxWidth:700,margin:"0 auto"}}>
        {subTab==="my"&&(
          <div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:24}}>
              {[["Pot","$3,200","#c97b2e"],["Hand",member.hand?`#${member.hand}`:"TBD","#7B3F8C"],["Paid",`${paid}/${due}`,arr>0?"#a83232":"#2e7d6e"],["Collected",`$${amt.toLocaleString()}`,"#c97b2e"],["Status",arr>0?`${arr} behind`:"Current",arr>0?"#a83232":"#2e7d6e"]].map(([l,v,c])=>(

                    style={{width:34,height:34,borderRadius:8,fontSize:10,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",
                      border:`1.5px solid ${cur?"rgba(201,123,46,.6)":p?"rgba(46,125,110,.4)":d?"rgba(168,50,50,.35)":"#2a2a2a"}`,
                      background:p?"rgba(46,125,110,.2)":d?"rgba(168,50,50,.18)":"#161616",
                      color:p?"#2e7d6e":d?"#a83232":"#333"}}>
                    {w.n}
                  </div>;
                })}
              </div>

                <span><span style={{color:"#2e7d6e"}}>■</span> Paid</span>
                <span><span style={{color:"#a83232"}}>■</span> Unpaid</span>
                <span><span style={{color:"#333"}}>■</span> Upcoming</span>
              </div>

          </div>
        )}

        {subTab==="draw"&&(
          <div>
            {drawWeek?(
              <div style={{background:"#1c1c1c",border:"1px solid rgba(201,123,46,.3)",borderRadius:16,padding:28,textAlign:"center"}}>
                <div style={{fontSize:11,color:"#555",textTransform:"uppercase",letterSpacing:".6px",marginBottom:16}}>Your Draw Info</div>

                  <div style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:12,padding:"16px 24px",minWidth:130}}>
                    <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>💳 Deposit Due</div>
                    <div style={{fontSize:18,fontWeight:700}}>{drawWeek.date}</div>
                    <div style={{fontSize:10,color:"#555",marginTop:4}}>Friday · Week {drawWeek.n}</div>
                  </div>
                  <div style={{background:"#161616",border:"1px solid rgba(201,123,46,.25)",borderRadius:12,padding:"16px 24px",minWidth:130}}>

        {subTab==="borrow"&&(
          <div>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px",marginBottom:14}}>
              <div style={{fontSize:11,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:14}}>Borrow Eligibility</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {[["Paid In",`$${amt.toLocaleString()}`,"#e8e0d4"],["Max Eligible",`$${eligibleBorrow.toLocaleString()}`,"#c97b2e"],["Active Borrow",activeBorrow?`$${activeBorrow.amount}`:"None",activeBorrow?"#a83232":"#2e7d6e"]].map(([l,v,c])=>(
                  <div key={l} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:10,padding:"12px 16px",flex:1,minWidth:100}}>
                    <div style={{fontSize:10,color:"#555",textTransform:"uppercase",marginBottom:5}}>{l}</div>
                    <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                  </div>
                ))}
              </div>
            </div>
            {activeBorrow&&(
              <div style={{background:"rgba(168,50,50,.1)",border:"1px solid rgba(168,50,50,.25)",borderRadius:12,padding:"14px 18px",marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:"#a83232",marginBottom:6}}>Active Borrow</div>
                <div style={{fontSize:11,color:"#888"}}>Amount: ${activeBorrow.amount} · Borrowed: {activeBorrow.borrowed_on} · Status: Unpaid</div>
              </div>
            )}
            {pendingRequest&&(
              <div style={{background:"rgba(201,123,46,.1)",border:"1px solid rgba(201,123,46,.25)",borderRadius:12,padding:"14px 18px",marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:"#c97b2e",marginBottom:6}}>⏳ Request Pending</div>
                <div style={{fontSize:11,color:"#888"}}>Amount: ${pendingRequest.amount} · Submitted: {pendingRequest.requested_on}</div>
                <div style={{fontSize:11,color:"#555",marginTop:4}}>Admin will review shortly.</div>
              </div>
            )}
            {!activeBorrow&&!pendingRequest&&(
              <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px"}}>
                <div style={{fontSize:12,fontWeight:600,marginBottom:14}}>Request a Borrow</div>
                <div style={{fontSize:11,color:"#555",marginBottom:6}}>Amount (min $100, max ${eligibleBorrow})</div>
                <input type="number" value={borrowAmt} onChange={e=>setBorrowAmt(e.target.value)} placeholder="Enter amount"
                  style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:13,marginBottom:10}}/>
                <div style={{fontSize:11,color:"#555",marginBottom:6}}>Reason (optional)</div>
                <textarea value={borrowReason} onChange={e=>setBorrowReason(e.target.value)} placeholder="Brief reason..."
                  style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:13,marginBottom:10,minHeight:70,resize:"vertical"}}/>
                {borrowMsg&&<div style={{fontSize:11,color:borrowMsg.includes("submitted")?"#2e7d6e":"#a83232",marginBottom:10}}>{borrowMsg}</div>}
                <button onClick={submitBorrowRequest} disabled={borrowSaving}
                  style={{width:"100%",background:"rgba(201,123,46,.2)",border:"1px solid rgba(201,123,46,.4)",borderRadius:8,padding:"11px",color:"#c97b2e",fontSize:13,fontWeight:600}}>
                  {borrowSaving?"Submitting...":"Submit Request"}
                </button>
              </div>
            )}
            {myBorrows.length>0&&(
              <div style={{marginTop:14}}>
                <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:10}}>Borrow History</div>
                {myBorrows.map(b=>(
                  <div key={b.id} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:10,padding:"12px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:13,fontWeight:600}}>${b.amount}</div><div style={{fontSize:10,color:"#555",marginTop:3}}>{b.borrowed_on}</div></div>
                    <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:b.repaid?"rgba(46,125,110,.15)":"rgba(168,50,50,.15)",color:b.repaid?"#2e7d6e":"#a83232",border:`1px solid ${b.repaid?"rgba(46,125,110,.3)":"rgba(168,50,50,.3)"}`}}>
                      {b.repaid?"Repaid":"Outstanding"}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {subTab==="donate"&&(
          <div>
            <div style={{background:"#1c1c1c",border:"1px solid rgba(46,125,110,.25)",borderRadius:16,padding:24,marginBottom:14,textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:10}}>🤝</div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>Community Donation</div>
              <div style={{fontSize:12,color:"#555",lineHeight:1.6}}>Completely voluntary. Any amount you choose will be deducted from your draw. You can change this anytime.</div>
            </div>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px"}}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
                {[["Your Draw","$3,200","#e8e0d4"],["Donation",`$${donationAmt}`,"#2e7d6e"],["You Receive",`$${(3200-donationAmt).toLocaleString()}`,"#c97b2e"]].map(([l,v,c])=>(
                  <div key={l} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:10,padding:"12px 16px",flex:1,minWidth:90}}>
                    <div style={{fontSize:10,color:"#555",textTransform:"uppercase",marginBottom:5}}>{l}</div>
                    <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                  </div>
                ))}
              </div>
              <div style={{fontSize:11,color:"#555",marginBottom:6}}>Donation amount (enter 0 to remove)</div>
              <input type="number" value={donationInput} onChange={e=>setDonationInput(e.target.value)} placeholder="e.g. 100"
                style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:14,textAlign:"center",marginBottom:10}}/>
              {donationMsg&&<div style={{fontSize:11,color:"#2e7d6e",marginBottom:10}}>{donationMsg}</div>}
              <button onClick={saveDonation} disabled={donationSaving}
                style={{width:"100%",background:"rgba(46,125,110,.2)",border:"1px solid rgba(46,125,110,.4)",borderRadius:8,padding:"11px",color:"#2e7d6e",fontSize:13,fontWeight:600}}>
                {donationSaving?"Saving...":"Save Donation"}
              </button>
            </div>
          </div>
        )}

        {subTab==="pin"&&(
          <ChangePinForm currentPin={member.pin} onSave={saveMemberPin} onCancel={()=>setSubTab("my")}/>
        )}
      </div>
    </div>
  );
}

function AdminView({members,allPayments,setAllPayments,borrows,setBorrows,donations,borrowRequests,setBorrowRequests,cw,onLogout,adminPin,onAdminPinSaved,onMemberPinReset,sessionToken}){
  const[tab,setTab]=useState("overview");
  const[fmem,setFmem]=useState(null);
  const[borrowForm,setBorrowForm]=useState({});
  const[borrowMsg,setBorrowMsg]=useState({});
  const[sessionRemaining,setSessionRemaining]=useState(SESSION_TIMEOUT/1000);

  useEffect(()=>{
    const interval=setInterval(()=>{
      const sess=validateSession(sessionToken);
      if(!sess){onLogout();return;}
      const remaining=Math.ceil((sess.expires-Date.now())/1000);
      setSessionRemaining(remaining);
      if(remaining<=0)onLogout();
    },1000);
    return()=>clearInterval(interval);
  },[sessionToken]);

  const handleActivity=useCallback(()=>refreshSession(sessionToken),[sessionToken]);
  const extendSession=()=>setSessionRemaining(SESSION_TIMEOUT/1000);

  const stats=members.map((m,i)=>{
    const mp=allPayments[m.id]||{};
    const paid=WEEKS.filter(w=>w.n<=cw&&mp[w.n]).length;
    const due=Math.min(cw,NWEEKS);
    const myBorrows=borrows.filter(b=>b.member_id===m.id);
    const activeBorrow=myBorrows.find(b=>!b.repaid);
    const myDonation=donations.find(d=>d.member_id===m.id);
    const donationAmt=myDonation?parseFloat(myDonation.amount):0;
    return{...m,idx:i,paid,due,arr:due-paid,amt:paid*100,eligibleBorrow:Math.floor(paid*100*0.5),activeBorrow,donationAmt,myBorrows};
  });

  const totCol=stats.reduce((s,m)=>s+m.amt,0);
  const totArr=stats.reduce((s,m)=>s+m.arr,0);
  const health=Math.round((stats.reduce((s,m)=>s+m.paid,0)/(members.length*cw))*100);
  const totDonations=donations.reduce((s,d)=>s+parseFloat(d.amount||0),0);
  const potMap={};members.forEach(m=>{if(m.hand)potMap[m.hand]=m;});
  const pendingRequests=borrowRequests.filter(r=>r.status==="pending");

  const toggle=async(mid,wn)=>{
    handleActivity();
    const cur=allPayments[mid]?.[wn]||false;
    setAllPayments(p=>({...p,[mid]:{...p[mid],[wn]:!cur}}));
    await SUPA.from("payments").update({paid:!cur}).eq("member_id",mid).eq("week_num",wn);
  };

  const logBorrow=async(mid)=>{
    handleActivity();
    const amt=parseFloat(borrowForm[mid]||0);
    if(!amt||amt<100){setBorrowMsg(p=>({...p,[mid]:"Min $100."}));return;}
    const m=stats.find(s=>s.id===mid);
    if(amt>m.eligibleBorrow){setBorrowMsg(p=>({...p,[mid]:`Max $${m.eligibleBorrow}.`}));return;}
    const{data}=await SUPA.from("borrows").insert({member_id:mid,amount:amt}).select().single();
    if(data){
      setBorrows(prev=>[...prev,data]);
      setBorrowForm(p=>({...p,[mid]:""}));
      setBorrowMsg(p=>({...p,[mid]:"Borrow logged."}));
      setTimeout(()=>setBorrowMsg(p=>({...p,[mid]:""})),3000);
    }
  };

  const toggleRepaid=async(borrowId,current)=>{
    handleActivity();
    await SUPA.from("borrows").update({repaid:!current,repaid_on:!current?new Date().toISOString().split("T")[0]:null}).eq("id",borrowId);
    setBorrows(prev=>prev.map(b=>b.id===borrowId?{...b,repaid:!current}:b));
  };

  const reviewRequest=async(reqId,approved,memberId,amount)=>{
    handleActivity();
    await SUPA.from("borrow_requests").update({status:approved?"approved":"declined",reviewed_on:new Date().toISOString().split("T")[0]}).eq("id",reqId);
    if(approved){
      const{data}=await SUPA.from("borrows").insert({member_id:memberId,amount}).select().single();
      if(data)setBorrows(prev=>[...prev,data]);
    }
    setBorrowRequests(prev=>prev.map(r=>r.id===reqId?{...r,status:approved?"approved":"declined"}:r));
  };

  const saveAdminPin=async(newPin)=>{
    await SUPA.from("admin_settings").update({pin:newPin}).eq("id",1);
    onAdminPinSaved(newPin);
  };

  const resetMemberPin=async(id)=>{
    const defaults=["1111","2222","3333","4444","5555","6666","7777","8888","9999","0000"];
    const defPin=defaults[id-1];
    await SUPA.from("members").update({pin:defPin}).eq("id",id);
    onMemberPinReset(id,defPin);
  };

  const card=(label,val,sub,color)=>(
    <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"14px 18px",flex:1,minWidth:120}}>
      <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:5}}>{label}</div>
      <div style={{fontSize:24,fontWeight:700,lineHeight:1,color:color||"#e8e0d4"}}>{val}</div>
      {sub&&<div style={{fontSize:10,color:"#555",marginTop:4}}>{sub}</div>}
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#111"}} onClick={handleActivity} onKeyDown={handleActivity}>
      <SessionWarning remaining={sessionRemaining} onExtend={extendSession}/>
      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:700}}>💰 3200 Pardna — Admin</div>
          <div style={{fontSize:10,color:"#555",marginTop:2}}>Jun 13 2025 → Jan 16 2026</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {pendingRequests.length>0&&<span style={{background:"rgba(168,50,50,.2)",color:"#a83232",border:"1px solid rgba(168,50,50,.3)",borderRadius:20,padding:"4px 10px",fontSize:11}}>⚠️ {pendingRequests.length} request{pendingRequests.length>1?"s":""}</span>}
          <span style={{background:"rgba(201,123,46,.15)",color:"#c97b2e",border:"1px solid rgba(201,123,46,.3)",borderRadius:20,padding:"4px 12px",fontSize:11}}>Week {cw}</span>
          <button onClick={onLogout} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:8,color:"#555",fontSize:11,padding:"4px 10px"}}>Logout</button>
        </div>
      </div>

      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",display:"flex",padding:"0 20px",overflowX:"auto"}}>
        {["overview","payments","borrows","donations","requests","schedule","members","settings"].map(t=>(
          <button key={t} onClick={()=>{setTab(t);handleActivity();}} style={{background:"none",border:"none",borderBottom:`2px solid ${tab===t?"#c97b2e":"transparent"}`,color:tab===t?"#c97b2e":"#555",fontSize:12,padding:"12px 14px",whiteSpace:"nowrap",textTransform:"capitalize",position:"relative"}}>
            {t}
            {t==="requests"&&pendingRequests.length>0&&<span style={{background:"#a83232",color:"#fff",borderRadius:"50%",fontSize:9,padding:"1px 5px",marginLeft:4}}>{pendingRequests.length}</span>}
          </button>
        ))}
      </div>

      <div style={{padding:20,maxWidth:960,margin:"0 auto"}}>

        {tab==="overview"&&(
          <div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:24}}>
              {card("Pot Size","$3,200",null,"#c97b2e")}
              {card("Collected",`$${totCol.toLocaleString()}`,`Week ${cw} of ${NWEEKS}`)}
              {card("Health",`${health}%`,null,health>=80?"#2e7d6e":health>=60?"#c97b2e":"#a83232")}
              {card("Arrears",totArr,"payments behind",totArr>0?"#a83232":"#2e7d6e")}
              {card("Reserve",`$${totDonations.toLocaleString()}`,"community fund","#2e7d6e")}
            </div>
            {pendingRequests.length>0&&(
              <div style={{background:"rgba(168,50,50,.08)",border:"1px solid rgba(168,50,50,.2)",borderRadius:12,padding:"14px 18px",marginBottom:20}}>
                <div style={{fontSize:12,fontWeight:600,color:"#a83232",marginBottom:10}}>⚠️ Pending Borrow Requests</div>
                {pendingRequests.map(r=>{
                  const m=members.find(x=>x.id===r.member_id);
                  return(
                    <div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:8}}>
                      <div style={{fontSize:12}}><span style={{fontWeight:600}}>{m?.name}</span> · ${r.amount} · {r.requested_on}{r.reason&&` · "${r.reason}"`}</div>
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>reviewRequest(r.id,true,r.member_id,r.amount)} style={{background:"rgba(46,125,110,.2)",border:"1px solid rgba(46,125,110,.4)",borderRadius:8,color:"#2e7d6e",fontSize:11,padding:"4px 12px"}}>Approve</button>
                        <button onClick={()=>reviewRequest(r.id,false,r.member_id,r.amount)} style={{background:"rgba(168,50,50,.15)",border:"1px solid rgba(168,50,50,.3)",borderRadius:8,color:"#a83232",fontSize:11,padding:"4px 12px"}}>Decline</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:10}}>Members</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:10}}>
              {stats.map(m=>(
                <div key={m.id} onClick={()=>{setFmem(m.id);setTab("payments");handleActivity();}}
                  style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"13px 15px",display:"flex",alignItems:"center",gap:11,cursor:"pointer"}}>
                  <Av name={m.name} idx={m.idx}/>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>{m.name}</span><HBadge hand={m.hand}/></div>
                    <div style={{background:"#2a2a2a",borderRadius:4,height:4,overflow:"hidden"}}>
                      <div style={{width:`${m.due>0?(m.paid/m.due)*100:0}%`,height:"100%",background:m.arr>0?"#a83232":"#2e7d6e",borderRadius:4}}/>
                    </div>
                    <div style={{fontSize:10,color:"#555",marginTop:4,display:"flex",justifyContent:"space-between"}}>
                      <span>{m.paid}/{m.due} paid</span>
                      <span style={{color:m.arr>0?"#a83232":"#2e7d6e"}}>{m.arr>0?`${m.arr} behind`:"✓ current"}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==="payments"&&(
          <div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:16,alignItems:"center"}}>
              <span style={{fontSize:11,color:"#555"}}>Filter:</span>
              <button onClick={()=>setFmem(null)} style={{background:!fmem?"rgba(201,123,46,.12)":"none",border:`1px solid ${!fmem?"rgba(201,123,46,.45)":"#2a2a2a"}`,borderRadius:20,color:!fmem?"#c97b2e":"#555",fontSize:11,padding:"4px 11px"}}>All</button>
              {stats.map(m=><button key={m.id} onClick={()=>setFmem(fmem===m.id?null:m.id)} style={{background:fmem===m.id?"rgba(201,123,46,.12)":"none",border:`1px solid ${fmem===m.id?"rgba(201,123,46,.45)":"#2a2a2a"}`,borderRadius:20,color:fmem===m.id?"#c97b2e":"#555",fontSize:11,padding:"4px 11px"}}>{m.name}</button>)}
            </div>
            {(fmem?stats.filter(m=>m.id===fmem):stats).map(m=>(
              <div key={m.id} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:14}}>
                  <Av name={m.name} idx={m.idx}/>
                  <div>
                    <div style={{fontSize:14,fontWeight:600,display:"flex",gap:8,alignItems:"center"}}>{m.name}<HBadge hand={m.hand}/></div>
                    <div style={{fontSize:11,color:"#555",marginTop:3}}>{m.paid} paid · <span style={{color:m.arr>0?"#a83232":"#2e7d6e"}}>{m.arr>0?`${m.arr} behind`:"current"}</span> · ${m.amt.toLocaleString()}</div>
                  </div>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {WEEKS.map(w=>{
                    const paid=allPayments[m.id]?.[w.n]||false,due=w.n<=cw,cur=w.n===cw;
                    return<div key={w.n} title={`Week ${w.n} · ${w.date}`} onClick={()=>due&&toggle(m.id,w.n)}
                      style={{width:34,height:34,borderRadius:8,fontSize:10,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",
                        border:`1.5px solid ${cur?"rgba(201,123,46,.6)":paid?"rgba(46,125,110,.4)":due?"rgba(168,50,50,.35)":"#2a2a2a"}`,
                        background:paid?"rgba(46,125,110,.2)":due?"rgba(168,50,50,.18)":"#161616",
                        color:paid?"#2e7d6e":due?"#a83232":"#333",cursor:due?"pointer":"default"}}>
                      {w.n}
                    </div>;
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {tab==="borrows"&&(
          <div>
            {stats.map(m=>(
              <div key={m.id} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:14}}>
                  <Av name={m.name} idx={m.idx}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,marginBottom:3}}>{m.name}</div>
                    <div style={{fontSize:11,color:"#555"}}>Paid in: ${m.amt.toLocaleString()} · Eligible: <span style={{color:"#c97b2e"}}>${m.eligibleBorrow.toLocaleString()}</span> · {m.activeBorrow?<span style={{color:"#a83232"}}>Active: ${m.activeBorrow.amount}</span>:<span style={{color:"#2e7d6e"}}>No active borrow</span>}</div>
                  </div>
                </div>
                <div style={{display:"flex",gap:8,marginBottom:m.myBorrows.length>0?12:0}}>
                  <input type="number" placeholder="Amount" value={borrowForm[m.id]||""} onChange={e=>setBorrowForm(p=>({...p,[m.id]:e.target.value}))}
                    style={{flex:1,background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 12px",fontSize:13}}/>
                  <button onClick={()=>logBorrow(m.id)} style={{background:"rgba(201,123,46,.2)",border:"1px solid rgba(201,123,46,.4)",borderRadius:8,color:"#c97b2e",fontSize:12,padding:"8px 14px"}}>Log Borrow</button>
                </div>
                {borrowMsg[m.id]&&<div style={{fontSize:11,color:"#c97b2e",marginBottom:8}}>{borrowMsg[m.id]}</div>}
                {m.myBorrows.map(b=>(
                  <div key={b.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#161616",borderRadius:8,padding:"10px 14px",marginBottom:6}}>
                    <div><div style={{fontSize:13,fontWeight:600}}>${b.amount}</div><div style={{fontSize:10,color:"#555"}}>{b.borrowed_on}</div></div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:b.repaid?"rgba(46,125,110,.15)":"rgba(168,50,50,.15)",color:b.repaid?"#2e7d6e":"#a83232",border:`1px solid ${b.repaid?"rgba(46,125,110,.3)":"rgba(168,50,50,.3)"}`}}>
                        {b.repaid?"Repaid":"Outstanding"}
                      </span>
                      <button onClick={()=>toggleRepaid(b.id,b.repaid)} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:8,color:"#555",fontSize:10,padding:"3px 8px"}}>
                        {b.repaid?"Mark Unpaid":"Mark Repaid"}
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}

        {tab==="donations"&&(
          <div>
            <div style={{background:"#1c1c1c",border:"1px solid rgba(46,125,110,.25)",borderRadius:12,padding:"14px 20px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:13,fontWeight:600}}>🤝 Community Reserve Fund</div>
              <div style={{fontSize:24,fontWeight:700,color:"#2e7d6e"}}>${totDonations.toLocaleString()}</div>
            </div>
            {stats.map(m=>{
              const dw=m.hand?WEEKS[m.hand-1]:null;
              return(
                <div key={m.id} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"14px 18px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <Av name={m.name} idx={m.idx} size={32}/>
                    <div>
                      <div style={{fontSize:13,fontWeight:600}}>{m.name}</div>
                      <div style={{fontSize:10,color:"#555",marginTop:2}}>{dw?`Draw: ${dw.drawDate}`:"No hand assigned"}</div>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    {m.donationAmt>0?(
                      <div>
                        <div style={{fontSize:16,fontWeight:700,color:"#2e7d6e"}}>+${m.donationAmt}</div>
                        <div style={{fontSize:10,color:"#555"}}>Receives ${(3200-m.donationAmt).toLocaleString()}</div>
                      </div>
                    ):(
                      <div style={{fontSize:11,color:"#444"}}>No donation pledged</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab==="requests"&&(
          <div>
            <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:14}}>Borrow Requests</div>
            {borrowRequests.length===0&&<div style={{fontSize:12,color:"#444",padding:20,textAlign:"center"}}>No requests yet.</div>}
            {borrowRequests.sort((a,b)=>a.status==="pending"?-1:1).map(r=>{
              const m=members.find(x=>x.id===r.member_id);
              return(
                <div key={r.id} style={{background:"#1c1c1c",border:`1px solid ${r.status==="pending"?"rgba(201,123,46,.3)":r.status==="approved"?"rgba(46,125,110,.25)":"rgba(168,50,50,.2)"}`,borderRadius:12,padding:"16px 20px",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Av name={m?.name||"?"} idx={r.member_id-1} size={32}/>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{m?.name} · <span style={{color:"#c97b2e"}}>${r.amount}</span></div>
                        <div style={{fontSize:10,color:"#555",marginTop:3}}>{r.requested_on}{r.reason&&` · "${r.reason}"`}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,
                        background:r.status==="pending"?"rgba(201,123,46,.15)":r.status==="approved"?"rgba(46,125,110,.15)":"rgba(168,50,50,.15)",
                        color:r.status==="pending"?"#c97b2e":r.status==="approved"?"#2e7d6e":"#a83232",
                        border:`1px solid ${r.status==="pending"?"rgba(201,123,46,.3)":r.status==="approved"?"rgba(46,125,110,.3)":"rgba(168,50,50,.3)"}`}}>
                        {r.status}
                      </span>
                      {r.status==="pending"&&(
                        <>
                          <button onClick={()=>reviewRequest(r.id,true,r.member_id,r.amount)} style={{background:"rgba(46,125,110,.2)",border:"1px solid rgba(46,125,110,.4)",borderRadius:8,color:"#2e7d6e",fontSize:11,padding:"4px 12px"}}>Approve</button>
                          <button onClick={()=>reviewRequest(r.id,false,r.member_id,r.amount)} style={{background:"rgba(168,50,50,.15)",border:"1px solid rgba(168,50,50,.3)",borderRadius:8,color:"#a83232",fontSize:11,padding:"4px 12px"}}>Decline</button>
                        </>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab==="schedule"&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(175px,1fr))",gap:8}}>
            {WEEKS.map(w=>{
              const rec=potMap[w.n];
              const past=w.n<cw,cur=w.n===cw;
              const midx=rec?members.findIndex(m=>m.id===rec.id):-1;
              const recStat=rec?stats.find(s=>s.id===rec.id):null;
              return(
                <div key={w.n} style={{background:cur?"rgba(201,123,46,.08)":"#1c1c1c",border:`1px solid ${cur?"rgba(201,123,46,.35)":"#2a2a2a"}`,borderRadius:10,padding:"12px 14px",opacity:past&&!cur?.55:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                    <span style={{fontSize:10,color:"#555"}}>Wk {w.n}</span>
                    {cur&&<span style={{fontSize:9,color:"#c97b2e",background:"rgba(201,123,46,.15)",padding:"1px 6px",borderRadius:10}}>NOW</span>}
                    {past&&!cur&&<span style={{fontSize:9,color:"#444"}}>past</span>}
                  </div>
                  <div style={{fontSize:10,color:"#666"}}>💳 {w.date}</div>
                  <div style={{fontSize:10,color:"#c97b2e",marginBottom:8}}>💰 {w.drawDate}</div>
                  {rec
                    ?<div>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><Av name={rec.name} idx={midx} size={26}/><div><div style={{fontSize:12,fontWeight:600}}>{rec.name}</div><div style={{fontSize:10,color:"#c97b2e"}}>${recStat?3200-recStat.donationAmt:3200}</div></div></div>
                      {recStat?.donationAmt>0&&<div style={{fontSize:9,color:"#2e7d6e"}}>+${recStat.donationAmt} to reserve</div>}
                    </div>
                    :<div style={{fontSize:11,color:"#333",fontStyle:"italic"}}>Unassigned</div>
                  }
                </div>
              );
            })}
          </div>
        )}

        {tab==="members"&&(
          <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,overflow:"hidden"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 80px 90px 90px 70px 80px 75px",padding:"10px 18px",borderBottom:"1px solid #2a2a2a",fontSize:10,color:"#555",textTransform:"uppercase"}}>
              <span>Member</span><span>Hand</span><span>Deposit</span><span>Draw</span><span>Paid</span><span>Collected</span><span>Status</span>
            </div>
            {stats.map(m=>{
              const dw=m.hand?WEEKS[m.hand-1]:null;
              return(
                <div key={m.id} style={{display:"grid",gridTemplateColumns:"1fr 80px 90px 90px 70px 80px 75px",padding:"12px 18px",alignItems:"center",borderBottom:"1px solid #1a1a1a"}}>
                  <div style={{display:"flex",alignItems:"center",gap:9}}><Av name={m.name} idx={m.idx} size={30}/><span style={{fontSize:13}}>{m.name}</span></div>
                  <HBadge hand={m.hand}/>
                  <span style={{fontSize:11,color:"#666"}}>{dw?dw.date:"—"}</span>
                  <span style={{fontSize:11,color:"#c97b2e"}}>{dw?dw.drawDate:"—"}</span>
                  <span style={{fontSize:13}}>{m.paid}<span style={{color:"#444"}}>/{m.due}</span></span>
                  <span style={{fontSize:13,color:"#c97b2e"}}>${m.amt.toLocaleString()}</span>
                  <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:m.arr>0?"rgba(168,50,50,.15)":"rgba(46,125,110,.15)",color:m.arr>0?"#a83232":"#2e7d6e",border:`1px solid ${m.arr>0?"rgba(168,50,50,.3)":"rgba(46,125,110,.3)"}`}}>
                    {m.arr>0?`${m.arr} behind`:"current"}
                  </span>
                </div>
              );
            })}
          </div>
        )}

        {tab==="settings"&&(
          <div style={{maxWidth:500}}>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,marginBottom:16,overflow:"hidden"}}>
              <div style={{padding:"14px 20px",borderBottom:"1px solid #2a2a2a",fontSize:13,fontWeight:600}}>🔐 Change Admin PIN</div>
              <ChangePinForm currentPin={adminPin} onSave={saveAdminPin} onCancel={()=>{}}/>
            </div>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,overflow:"hidden"}}>
              <div style={{padding:"14px 20px",borderBottom:"1px solid #2a2a2a",fontSize:13,fontWeight:600}}>👥 Reset Member PINs</div>
              <div style={{padding:"8px 0"}}>
                {members.map((m,i)=>(
                  <div key={m.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 20px",borderBottom:"1px solid #1a1a1a"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Av name={m.name} idx={i} size={30}/>
                      <span style={{fontSize:13}}>{m.name}</span>
                    </div>
                    <button onClick={()=>resetMemberPin(m.id)} style={{background:"rgba(168,50,50,.15)",border:"1px solid rgba(168,50,50,.3)",borderRadius:8,color:"#a83232",fontSize:11,padding:"5px 12px"}}>Reset to default</button>
                  </div>
                ))}
              </div>
              <div style={{padding:"10px 20px",fontSize:10,color:"#444"}}>Resetting returns member PIN to their default.</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const[members,setMembers]=useState([]);
  const[allPayments,setAllPayments]=useState({});
  const[borrows,setBorrows]=useState([]);
  const[donations,setDonations]=useState([]);
  const[borrowRequests,setBorrowRequests]=useState([]);
  const[adminPin,setAdminPin]=useState("1234");
  const[role,setRole]=useState(null);
  const[currentMember,setCurrentMember]=useState(null);
  const[loading,setLoading]=useState(true);
  const[sessionToken,setSessionToken]=useState(null);
  const cw=useMemo(getCurWeek,[]);

  useEffect(()=>{
    async function load(){
      const[memRes,payRes,admRes,borRes,donRes,reqRes]=await Promise.all([
        SUPA.from("members").select("*").order("id"),
        SUPA.from("payments").select("*"),
        SUPA.from("admin_settings").select("*").eq("id",1).single(),
        SUPA.from("borrows").select("*").order("borrowed_on",{ascending:false}),
        SUPA.from("donations").select("*"),
        SUPA.from("borrow_requests").select("*").order("requested_on",{ascending:false}),
      ]);
      setMembers(memRes.data||[]);
      const pm={};
      (payRes.data||[]).forEach(r=>{
        if(!pm[r.member_id])pm[r.member_id]={};
        pm[r.member_id][r.week_num]=r.paid;
      });
      setAllPayments(pm);
      if(admRes.data)setAdminPin(admRes.data.pin);
      setBorrows(borRes.data||[]);
      setDonations(donRes.data||[]);
      setBorrowRequests(reqRes.data||[]);
      setLoading(false);
    }
    load();
  },[]);

  const handleLogin=(r,m)=>{
    const token=createSession(r,m);
    setSessionToken(token);
    setRole(r);
    setCurrentMember(m);
  };

  const handleLogout=()=>{
    destroySession();
    setSessionToken(null);
    setRole(null);
    setCurrentMember(null);
  };

  const handleMemberPin=(id,newPin)=>{
    setMembers(prev=>prev.map(m=>m.id===id?{...m,pin:newPin}:m));
    if(currentMember?.id===id)setCurrentMember(prev=>({...prev,pin:newPin}));
  };

  const handleMemberPinReset=(id,defPin)=>setMembers(prev=>prev.map(m=>m.id===id?{...m,pin:defPin}:m));

  const handleDonationUpdate=async(memberId,amount,existingId)=>{
    if(existingId){
      await SUPA.from("donations").update({amount}).eq("id",existingId);
      setDonations(prev=>prev.map(d=>d.id===existingId?{...d,amount}:d));
    } else if(amount>0){
      const{data}=await SUPA.from("donations").insert({member_id:memberId,amount}).select().single();
      if(data)setDonations(prev=>[...prev,data]);
    }
  };

  const handleBorrowRequest=async(memberId,amount,reason)=>{
    const{data}=await SUPA.from("borrow_requests").insert({member_id:memberId,amount,reason}).select().single();
    if(data)setBorrowRequests(prev=>[...prev,data]);
  };

  if(loading)return<Loading/>;
  if(!role)return<Login members={members} adminPin={adminPin} onLogin={handleLogin}/>;
  if(role==="member"){
    const mp=allPayments[currentMember.id]||{};
    return<MemberView member={currentMember} payments={mp} borrows={borrows}
      donations={donations} borrowRequests={borrowRequests} cw={cw}
      onLogout={handleLogout} onPinSaved={handleMemberPin}
      onDonationUpdate={handleDonationUpdate} onBorrowRequest={handleBorrowRequest}
      sessionToken={sessionToken}/>;
  }
  if(role==="admin")return<AdminView members={members} allPayments={allPayments}
    setAllPayments={setAllPayments} borrows={borrows} setBorrows={setBorrows}
    donations={donations} borrowRequests={borrowRequests} setBorrowRequests={setBorrowRequests}
    cw={cw} onLogout={handleLogout} adminPin={adminPin} onAdminPinSaved={setAdminPin}
    onMemberPinReset={handleMemberPinReset} sessionToken={sessionToken}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
