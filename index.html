<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pardna Portal</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#e8e0d4;font-family:monospace;min-height:100vh}
input,select,textarea{outline:none;color:#e8e0d4;font-family:monospace}
button{font-family:monospace;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useMemo,useRef,useCallback}=React;

async function callApi(action,params={}){
  const r=await fetch('/api/pardna',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...params})});
  return r.json();
}

const SESSION_TIMEOUT=30*60*1000;
const MAX_ATTEMPTS=5;
const LOCKOUT_TIME=5*60*1000;
const RESERVE_CONTRIBUTION=25;
const LATE_FEE_START_HOUR=20;

const secStore={attempts:{},lockouts:{},session:null};
function genToken(){return Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,"0")).join("");}
function getLockoutKey(name){return`lockout_${name.toLowerCase()}`;}
function isLockedOut(name){const key=getLockoutKey(name);const lockTime=secStore.lockouts[key];if(!lockTime)return false;if(Date.now()-lockTime>LOCKOUT_TIME){delete secStore.lockouts[key];delete secStore.attempts[key];return false;}return true;}
function getLockoutRemaining(name){const key=getLockoutKey(name);const lockTime=secStore.lockouts[key];if(!lockTime)return 0;return Math.max(0,Math.ceil((LOCKOUT_TIME-(Date.now()-lockTime))/1000));}
function recordFailedAttempt(name){const key=getLockoutKey(name);secStore.attempts[key]=(secStore.attempts[key]||0)+1;if(secStore.attempts[key]>=MAX_ATTEMPTS)secStore.lockouts[key]=Date.now();return MAX_ATTEMPTS-secStore.attempts[key];}
function clearAttempts(name){const key=getLockoutKey(name);delete secStore.attempts[key];delete secStore.lockouts[key];}
function createSession(role,member){const token=genToken();secStore.session={role,member,token,expires:Date.now()+SESSION_TIMEOUT};return token;}
function validateSession(token){if(!secStore.session||secStore.session.token!==token||Date.now()>secStore.session.expires)return null;return secStore.session;}
function refreshSession(token){if(secStore.session&&secStore.session.token===token)secStore.session.expires=Date.now()+SESSION_TIMEOUT;}
function destroySession(){secStore.session=null;}

const AVCOLS=["#C97B2E","#2E7D6E","#7B3F8C","#2E5F9B","#A83232","#5B8A2E","#8C5B2E","#2E7B8C","#7B6A2E","#3A7B8C"];
const START=new Date("2025-06-13");
const NWEEKS=32;

function genWeeks(){
  return Array.from({length:NWEEKS},(_,i)=>{
    const d=new Date(START);d.setDate(d.getDate()+i*7);
    const draw=new Date(d);draw.setDate(draw.getDate()+1);
    const lateStart=new Date(d);lateStart.setHours(LATE_FEE_START_HOUR,0,0,0);
    return{n:i+1,date:d.toLocaleDateString("en-US",{month:"short",day:"numeric"}),drawDate:draw.toLocaleDateString("en-US",{month:"short",day:"numeric"}),full:d,lateStart};
  });
}
const WEEKS=genWeeks();
function getCurWeek(){const t=new Date();let c=0;WEEKS.forEach(w=>{if(t>=w.full)c=w.n;});return Math.max(1,c);}

function calcMissedDebt(lateWeeks){
  const missedCount=lateWeeks.filter(f=>!f.paid).length;
  if(missedCount===0)return{totalOwed:100,missedCount:0,reserveContributions:0,nextWeekAmount:100};
  const missedDebt=missedCount*100;
  const reserveContributions=missedCount*RESERVE_CONTRIBUTION;
  const totalOwed=missedDebt+reserveContributions+100;
  return{totalOwed,missedCount,reserveContributions,nextWeekAmount:totalOwed};
}

function Av({name,idx,size=36}){const c=AVCOLS[idx%AVCOLS.length];return<div style={{width:size,height:size,borderRadius:"50%",background:c+"28",border:`1.5px solid ${c}55`,color:c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.4,fontWeight:700,flexShrink:0}}>{name[0]}</div>;}
function HBadge({hand}){return hand?<span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:"rgba(201,123,46,.15)",color:"#c97b2e",border:"1px solid rgba(201,123,46,.3)",fontWeight:600}}>Hand #{hand}</span>:<span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:"rgba(255,255,255,.05)",color:"#555",border:"1px solid #2a2a2a"}}>Unassigned</span>;}
function Loading(){return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#111"}}><div style={{textAlign:"center"}}><div style={{fontSize:32,marginBottom:12}}>💰</div><div style={{fontSize:13,color:"#555"}}>Loading Pardna Portal...</div></div></div>;}
function SessionWarning({remaining,onExtend}){if(remaining>60)return null;return<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:"#1c1c1c",border:"1px solid rgba(201,123,46,.4)",borderRadius:12,padding:"12px 20px",zIndex:100,display:"flex",alignItems:"center",gap:12,boxShadow:"0 4px 20px rgba(0,0,0,.5)"}}><span style={{fontSize:12,color:"#c97b2e"}}>⏱ Session expires in {remaining}s</span><button onClick={onExtend} style={{background:"rgba(201,123,46,.2)",border:"1px solid rgba(201,123,46,.4)",borderRadius:8,color:"#c97b2e",fontSize:11,padding:"4px 12px"}}>Stay Logged In</button></div>;}

function Disclosure(){
  const sections=[
    {title:"What this is",body:"This is a private rotating savings group between trusted members. It is not a bank, financial institution, or investment product. No interest is earned on contributions."},
    {title:"Your commitment",body:"By joining you agree to contribute $100 every week for the full cycle without exception. Consistency is the foundation that keeps the group strong for everyone."},
    {title:"Payments",body:"All contributions are made in good faith between members. Weekly deposits are due by 8pm every Friday. Staying consistent protects your draw and builds your standing in the group."},
    {title:"Missed Payments",body:"Life happens. If a payment is missed your following week's contribution will be adjusted to include the missed week plus a $25 reserve contribution. That $25 is held safely in your personal reserve and returned to you in full at the end of the cycle. The more you contribute the more comes back to you."},
    {title:"Draws",body:"Your draw amount is based on your total contributions plus any extra capital added. Members who grow their contributions naturally unlock a larger payout when their draw arrives. Your reserve contributions are refunded at end of cycle and added to your final draw."},
    {title:"Extra Capital",body:"Members have the freedom to add extra capital any week entirely on their own terms. Think of it as quietly building your own payout — every dollar added works in your favor and comes back to you at draw time. Members receive their full Pardna draw on top of any extra capital contributed, meaning your draw and your extra capital are paid out together. For members throwing multiple hands, extra capital is divided evenly across each hand — growing every draw simultaneously. There is no cap, no pressure, and no fixed schedule. Your extra capital is yours."},
    {title:"Borrowing",body:"Members with a strong payment history are eligible to borrow up to 50% of their total contributions. Members who build their contributions over time naturally expand their borrowing access — giving them a financial cushion when life calls for it. Approval is based on payment history and is at the banker's discretion."},
    {title:"No guarantees",body:"The banker is a fellow member coordinating the group in good faith. This is not a legally registered financial service. Members join voluntarily and assume full responsibility for their participation."},
    {title:"Privacy",body:"Your information is shared only within this group and never sold or distributed to third parties."},
  ];
  return(
    <div style={{maxWidth:680,margin:"0 auto"}}>
      <div style={{background:"linear-gradient(135deg,rgba(201,123,46,.1),rgba(46,125,110,.08))",border:"1px solid rgba(201,123,46,.2)",borderRadius:16,padding:"24px 28px",marginBottom:20,textAlign:"center"}}>
        <div style={{fontSize:28,marginBottom:10}}>💰</div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Welcome to the Pardna!</div>
        <div style={{fontSize:12,color:"#888",lineHeight:1.7}}>A private rotating savings group built on trust, consistency, and community. Please review the information below so you know exactly how everything works.</div>
      </div>
      {sections.map(s=>(
        <div key={s.title} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"18px 20px",marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:"#c97b2e",marginBottom:8,textTransform:"uppercase",letterSpacing:".5px"}}>{s.title}</div>
          <div style={{fontSize:12,color:"#aaa",lineHeight:1.8}}>{s.body}</div>
        </div>
      ))}
      <div style={{background:"rgba(255,255,255,.02)",border:"1px solid #2a2a2a",borderRadius:12,padding:"14px 20px",marginTop:10,textAlign:"center"}}>
        <div style={{fontSize:11,color:"#444",lineHeight:1.7}}>By accessing this portal you acknowledge that you have read and understood the terms outlined above. This group operates in good faith between all members.</div>
      </div>
    </div>
  );
}

function ChangePinForm({currentPin,onSave,onCancel}){
  const[cur,setCur]=useState("");const[n1,setN1]=useState("");const[n2,setN2]=useState("");
  const[err,setErr]=useState("");const[ok,setOk]=useState(false);const[saving,setSaving]=useState(false);
  const submit=async()=>{
    if(cur!==currentPin){setErr("Current PIN incorrect.");return;}
    if(n1.length<4){setErr("New PIN must be at least 4 digits.");return;}
    if(!/^\d+$/.test(n1)){setErr("PIN must be numbers only.");return;}
    if(n1!==n2){setErr("PINs don't match.");return;}
    if(n1===currentPin){setErr("New PIN must be different.");return;}
    setSaving(true);await onSave(n1);setSaving(false);setOk(true);
  };
  if(ok)return<div style={{textAlign:"center",padding:"40px 20px"}}><div style={{fontSize:28,marginBottom:12}}>✅</div><div style={{fontWeight:600,marginBottom:8}}>PIN Updated</div><button onClick={onCancel} style={{background:"rgba(46,125,110,.15)",border:"1px solid rgba(46,125,110,.35)",borderRadius:8,padding:"10px 24px",color:"#2e7d6e",fontSize:12}}>Done</button></div>;
  return(
    <div style={{maxWidth:320,margin:"0 auto",padding:20}}>
      {[["Current PIN",cur,setCur],["New PIN",n1,setN1],["Confirm New PIN",n2,setN2]].map(([lbl,val,set])=>(
        <div key={lbl} style={{marginBottom:14}}><div style={{fontSize:11,color:"#555",marginBottom:6}}>{lbl}</div><input type="password" value={val} onChange={e=>set(e.target.value)} style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:14,textAlign:"center"}}/></div>
      ))}
      {err&&<div style={{fontSize:11,color:"#a83232",marginBottom:12}}>{err}</div>}
      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel} style={{flex:1,background:"none",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px",color:"#555",fontSize:12}}>Cancel</button>
        <button onClick={submit} disabled={saving} style={{flex:1,background:"rgba(201,123,46,.2)",border:"1px solid rgba(201,123,46,.4)",borderRadius:8,padding:"10px",color:"#c97b2e",fontSize:12,fontWeight:600}}>{saving?"Saving...":"Save PIN"}</button>
      </div>
    </div>
  );
}

function Login({members,adminPin,onLogin}){
  const[name,setName]=useState("");const[pin,setPin]=useState("");const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);const[locked,setLocked]=useState(false);const[countdown,setCountdown]=useState(0);
  useEffect(()=>{if(!locked)return;const interval=setInterval(()=>{const r=getLockoutRemaining(name);setCountdown(r);if(r<=0){setLocked(false);setErr("");}},1000);return()=>clearInterval(interval);},[locked,name]);
  const submit=async()=>{
    if(!name){setErr("Please select your name.");return;}
    if(isLockedOut(name)){setLocked(true);setCountdown(getLockoutRemaining(name));setErr(`Locked. Try again in ${getLockoutRemaining(name)}s.`);return;}
    setLoading(true);setErr("");
    await new Promise(r=>setTimeout(r,300));
    if(name==="__admin__"&&pin===adminPin){clearAttempts("__admin__");onLogin("admin",null);return;}
    const m=members.find(m=>m.name.toLowerCase()===name.toLowerCase()&&m.pin===pin);
    if(m){clearAttempts(name);onLogin("member",m);}
    else{const remaining=recordFailedAttempt(name);if(isLockedOut(name)){setLocked(true);setCountdown(getLockoutRemaining(name));setErr("Too many failed attempts. Locked for 5 minutes.");}else setErr(`Incorrect PIN. ${remaining} attempt${remaining!==1?"s":""} remaining.`);}
    setLoading(false);setPin("");
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#111"}}>
      <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:16,padding:"40px 32px",width:"100%",maxWidth:340}}>
        <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:32,marginBottom:10}}>💰</div><div style={{fontSize:20,fontWeight:700}}>Pardna Portal</div><div style={{fontSize:11,color:"#555",marginTop:4}}>3200 Group · 10 Members</div></div>
        <div style={{fontSize:11,color:"#555",marginBottom:6}}>Your Name</div>
        <select value={name} onChange={e=>{setName(e.target.value);setErr("");setLocked(false);}} style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"11px 12px",color:name?"#e8e0d4":"#555",fontSize:13,marginBottom:12}}>
          <option value="">Select your name...</option>
          {members.map(m=><option key={m.id} value={m.name}>{m.name}</option>)}
          <option value="__admin__">Admin</option>
        </select>
        <div style={{fontSize:11,color:"#555",marginBottom:6}}>PIN</div>
        <input type="password" placeholder="Enter your PIN" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!locked&&submit()} disabled={locked}
          style={{width:"100%",background:"#111",border:`1px solid ${locked?"rgba(168,50,50,.4)":"#2a2a2a"}`,borderRadius:8,padding:"11px 12px",fontSize:15,textAlign:"center",marginBottom:10,opacity:locked?.6:1}}/>
        {locked&&<div style={{background:"rgba(168,50,50,.1)",border:"1px solid rgba(168,50,50,.25)",borderRadius:8,padding:"10px",textAlign:"center",marginBottom:10}}><div style={{fontSize:12,color:"#a83232",fontWeight:600}}>🔒 Account Locked</div><div style={{fontSize:11,color:"#888",marginTop:4}}>Try again in {countdown}s</div></div>}
        {!locked&&err&&<div style={{fontSize:11,color:"#a83232",marginBottom:10,textAlign:"center"}}>{err}</div>}
        <button onClick={submit} disabled={loading||locked} style={{width:"100%",background:locked?"rgba(255,255,255,.05)":"rgba(201,123,46,.2)",border:`1px solid ${locked?"#2a2a2a":"rgba(201,123,46,.4)"}`,borderRadius:8,padding:12,color:locked?"#444":"#c97b2e",fontSize:13,fontWeight:600}}>{loading?"Verifying...":locked?"Locked":"Enter"}</button>
      </div>
    </div>
  );
}

function MemberView({member,payments,borrows,donations,borrowRequests,extraCapital,lateFees,cw,onLogout,onPinSaved,onDonationUpdate,onBorrowRequest,sessionToken}){
  const[subTab,setSubTab]=useState("my");
  const[sessionRemaining,setSessionRemaining]=useState(SESSION_TIMEOUT/1000);
  useEffect(()=>{const interval=setInterval(()=>{const sess=validateSession(sessionToken);if(!sess){onLogout();return;}const remaining=Math.ceil((sess.expires-Date.now())/1000);setSessionRemaining(remaining);if(remaining<=0)onLogout();},1000);return()=>clearInterval(interval);},[sessionToken]);
  const handleActivity=useCallback(()=>refreshSession(sessionToken),[sessionToken]);
  const extendSession=()=>setSessionRemaining(SESSION_TIMEOUT/1000);

  const idx=member.id-1;
  const numHands=member.hands||1;
  const paid=WEEKS.filter(w=>w.n<=cw&&payments[w.n]).length;
  const due=Math.min(cw,NWEEKS);
  const arr=due-paid;
  const baseAmt=paid*100;
  const myExtra=extraCapital.filter(e=>e.member_id===member.id);
  const totalExtra=myExtra.reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const totalContributed=baseAmt+totalExtra;
  const eligibleBorrow=Math.floor(totalContributed*0.5);
  const baseDraw=numHands*3200;
  const extraPerHand=numHands>0?totalExtra/numHands:0;
  const drawWeek=member.hand?WEEKS[member.hand-1]:null;

  const myLateWeeks=lateFees.filter(f=>f.member_id===member.id&&!f.paid);
  const debtInfo=calcMissedDebt(myLateWeeks);
  const reserveContributions=myExtra.filter(e=>e.note==="reserve_contribution").reduce((s,e)=>s+parseFloat(e.amount||0),0);

  const myDonation=donations.find(d=>d.member_id===member.id);
  const donationAmt=myDonation?parseFloat(myDonation.amount):0;
  const finalDraw=baseDraw+totalExtra-donationAmt;

  const myBorrows=borrows.filter(b=>b.member_id===member.id);
  const activeBorrow=myBorrows.find(b=>!b.repaid);
  const myRequests=borrowRequests.filter(r=>r.member_id===member.id);
  const pendingRequest=myRequests.find(r=>r.status==="pending");

  const[donationInput,setDonationInput]=useState(donationAmt>0?String(donationAmt):"");
  const[donationSaving,setDonationSaving]=useState(false);
  const[donationMsg,setDonationMsg]=useState("");
  const[borrowAmt,setBorrowAmt]=useState("");
  const[borrowReason,setBorrowReason]=useState("");
  const[borrowMsg,setBorrowMsg]=useState("");
  const[borrowSaving,setBorrowSaving]=useState(false);

  const saveDonation=async()=>{handleActivity();setDonationSaving(true);const val=parseFloat(donationInput)||0;await onDonationUpdate(member.id,val,myDonation?.id);setDonationMsg(val===0?"Donation cleared.":"Donation saved!");setDonationSaving(false);setTimeout(()=>setDonationMsg(""),3000);};
  const submitBorrowRequest=async()=>{handleActivity();const amt2=parseFloat(borrowAmt);if(!amt2||amt2<100){setBorrowMsg("Minimum borrow is $100.");return;}if(amt2>eligibleBorrow){setBorrowMsg(`Max eligible is $${eligibleBorrow}.`);return;}if(activeBorrow){setBorrowMsg("You have an active unpaid borrow.");return;}if(pendingRequest){setBorrowMsg("You already have a pending request.");return;}setBorrowSaving(true);await onBorrowRequest(member.id,amt2,borrowReason);setBorrowMsg("Request submitted! Admin will review shortly.");setBorrowAmt("");setBorrowReason("");setBorrowSaving(false);};
  const saveMemberPin=async(newPin)=>{await callApi('updateMemberPin',{id:member.id,pin:newPin});onPinSaved(member.id,newPin);};

  const tabs=["my","draw","capital","borrow","donate","disclosure","pin"];

  return(
    <div style={{minHeight:"100vh",background:"#111"}} onClick={handleActivity} onKeyDown={handleActivity}>
      <SessionWarning remaining={sessionRemaining} onExtend={extendSession}/>
      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Av name={member.name} idx={idx}/>
          <div><div style={{fontSize:15,fontWeight:700}}>{member.name}</div><div style={{fontSize:10,color:"#555",marginTop:2}}><HBadge hand={member.hand}/>{numHands>1&&<span style={{marginLeft:6,fontSize:10,color:"#7B3F8C"}}>{numHands} hands</span>}</div></div>
        </div>
        <button onClick={onLogout} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:8,color:"#555",fontSize:11,padding:"4px 10px"}}>Logout</button>
      </div>
      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",display:"flex",padding:"0 20px",overflowX:"auto"}}>
        {tabs.map(t=>(
          <button key={t} onClick={()=>{setSubTab(t);handleActivity();}} style={{background:"none",border:"none",borderBottom:`2px solid ${subTab===t?"#c97b2e":"transparent"}`,color:subTab===t?"#c97b2e":"#555",fontSize:12,padding:"12px 14px",whiteSpace:"nowrap"}}>
            {t==="my"?"My Payments":t==="draw"?"My Draw":t==="capital"?"Extra Capital":t==="borrow"?"Borrow":t==="donate"?"Donate":t==="disclosure"?"Disclosure":"Change PIN"}
          </button>
        ))}
      </div>
      <div style={{padding:20,maxWidth:700,margin:"0 auto"}}>

        {subTab==="my"&&(
          <div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:24}}>
              {[["Base Paid",`$${baseAmt.toLocaleString()}`,"#e8e0d4"],["Extra Capital",`$${totalExtra.toLocaleString()}`,"#7B3F8C"],["Total In",`$${totalContributed.toLocaleString()}`,"#c97b2e"],["Weeks",`${paid}/${due}`,arr>0?"#a83232":"#2e7d6e"],["Status",arr>0?`${arr} behind`:"Current",arr>0?"#a83232":"#2e7d6e"]].map(([l,v,c])=>(
                <div key={l} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"13px 16px",flex:1,minWidth:90}}><div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:5}}>{l}</div><div style={{fontSize:15,fontWeight:700,color:c||"#e8e0d4"}}>{v}</div></div>
              ))}
            </div>

            {debtInfo.missedCount>0&&(
              <div style={{background:"rgba(201,123,46,.08)",border:"1px solid rgba(201,123,46,.25)",borderRadius:12,padding:"16px 18px",marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:"#c97b2e",marginBottom:10}}>📋 Next Week Payment Breakdown</div>
                <div style={{fontSize:11,color:"#888",lineHeight:2}}>
                  {myLateWeeks.map(f=>(
                    <div key={f.id} style={{display:"flex",justifyContent:"space-between"}}>
                      <span>Week {f.week_num} missed payment</span><span style={{color:"#e8e0d4"}}>$100</span>
                    </div>
                  ))}
                  {myLateWeeks.map(f=>(
                    <div key={`r${f.id}`} style={{display:"flex",justifyContent:"space-between"}}>
                      <span>Week {f.week_num} reserve contribution</span><span style={{color:"#2e7d6e"}}>$25 <span style={{fontSize:9,color:"#555"}}>(refunded end of cycle)</span></span>
                    </div>
                  ))}
                  <div style={{display:"flex",justifyContent:"space-between"}}><span>Current week</span><span style={{color:"#e8e0d4"}}>$100</span></div>
                  <div style={{display:"flex",justifyContent:"space-between",borderTop:"1px solid rgba(201,123,46,.2)",paddingTop:8,marginTop:4}}>
                    <span style={{fontWeight:600,color:"#c97b2e"}}>Next week total</span>
                    <span style={{fontWeight:600,color:"#c97b2e"}}>${debtInfo.totalOwed}</span>
                  </div>
                </div>
                <div style={{fontSize:10,color:"#555",marginTop:8}}>Reserve contributions are refunded in full at end of cycle.</div>
              </div>
            )}

            {reserveContributions>0&&(
              <div style={{background:"rgba(46,125,110,.08)",border:"1px solid rgba(46,125,110,.2)",borderRadius:12,padding:"12px 18px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:"#2e7d6e"}}>🏦 Reserve Balance</div>
                  <div style={{fontSize:10,color:"#555",marginTop:3}}>Returned to you at end of cycle</div>
                </div>
                <div style={{fontSize:20,fontWeight:700,color:"#2e7d6e"}}>${reserveContributions.toLocaleString()}</div>
              </div>
            )}

            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px"}}>
              <div style={{fontSize:11,color:"#555",marginBottom:14}}>Weekly Contributions</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {WEEKS.map(w=>{
                  const p=payments[w.n],d=w.n<=cw,cur=w.n===cw;
                  const lf=lateFees.find(f=>f.member_id===member.id&&f.week_num===w.n&&!f.paid);
                  const isLate=!!lf;
                  return<div key={w.n} title={`Week ${w.n} · ${w.date}${isLate?" · MISSED":""}`}
                    style={{width:34,height:34,borderRadius:8,fontSize:10,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",
                      border:`1.5px solid ${cur?"rgba(201,123,46,.6)":isLate?"rgba(201,123,46,.5)":p?"rgba(46,125,110,.4)":d?"rgba(168,50,50,.35)":"#2a2a2a"}`,
                      background:isLate?"rgba(201,123,46,.15)":p?"rgba(46,125,110,.2)":d?"rgba(168,50,50,.18)":"#161616",
                      color:isLate?"#c97b2e":p?"#2e7d6e":d?"#a83232":"#333"}}>
                    {w.n}{isLate&&<div style={{position:"absolute",top:-3,right:-3,width:6,height:6,borderRadius:"50%",background:"#c97b2e"}}/>}
                  </div>;
                })}
              </div>
              <div style={{display:"flex",gap:14,marginTop:12,fontSize:10,color:"#555",flexWrap:"wrap"}}>
                <span><span style={{color:"#2e7d6e"}}>■</span> Paid</span>
                <span><span style={{color:"#a83232"}}>■</span> Unpaid</span>
                <span><span style={{color:"#c97b2e"}}>■</span> Missed</span>
                <span><span style={{color:"#333"}}>■</span> Upcoming</span>
              </div>
            </div>
          </div>
        )}

        {subTab==="draw"&&(
          <div>
            {drawWeek?(
              <div style={{background:"#1c1c1c",border:"1px solid rgba(201,123,46,.3)",borderRadius:16,padding:28,textAlign:"center"}}>
                <div style={{fontSize:11,color:"#555",textTransform:"uppercase",letterSpacing:".6px",marginBottom:16}}>Your Draw Info</div>
                <div style={{fontSize:48,marginBottom:16}}>💰</div>
                <div style={{fontSize:32,fontWeight:700,color:"#c97b2e",marginBottom:8}}>${(finalDraw+reserveContributions).toLocaleString()}</div>
                <div style={{fontSize:11,color:"#555",marginBottom:20,lineHeight:1.8}}>
                  Base: ${baseDraw.toLocaleString()} ({numHands} hand{numHands>1?"s":""})<br/>
                  {totalExtra>0&&<>Extra Capital: +${totalExtra.toLocaleString()} (${extraPerHand.toLocaleString()} per hand)<br/></>}
                  {reserveContributions>0&&<span style={{color:"#2e7d6e"}}>Reserve Refund: +${reserveContributions}<br/></span>}
                  {donationAmt>0&&<>Donation: −${donationAmt}<br/></>}
                </div>
                <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
                  <div style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:12,padding:"16px 24px",minWidth:130}}>
                    <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>💳 Deposit Due</div>
                    <div style={{fontSize:18,fontWeight:700}}>{drawWeek.date}</div>
                    <div style={{fontSize:10,color:"#555",marginTop:4}}>Friday · Week {drawWeek.n}</div>
                  </div>
                  <div style={{background:"#161616",border:"1px solid rgba(201,123,46,.25)",borderRadius:12,padding:"16px 24px",minWidth:130}}>
                    <div style={{fontSize:10,color:"#c97b2e",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>💰 Draw Date</div>
                    <div style={{fontSize:18,fontWeight:700,color:"#c97b2e"}}>{drawWeek.drawDate}</div>
                    <div style={{fontSize:10,color:"#555",marginTop:4}}>Saturday · Week {drawWeek.n}</div>
                  </div>
                </div>
              </div>
            ):(
              <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:16,padding:40,textAlign:"center"}}>
                <div style={{fontSize:32,marginBottom:12}}>📋</div>
                <div style={{fontSize:15,fontWeight:600,marginBottom:8}}>Hand Not Yet Assigned</div>
              </div>
            )}
          </div>
        )}

        {subTab==="capital"&&(
          <div>
            <div style={{background:"#1c1c1c",border:"1px solid rgba(123,63,140,.3)",borderRadius:14,padding:"18px 20px",marginBottom:14}}>
              <div style={{fontSize:11,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:14}}>Extra Capital Summary</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
                {[["Total Extra",`$${totalExtra.toLocaleString()}`,"#7B3F8C"],["Reserve",`$${reserveContributions.toLocaleString()}`,"#2e7d6e"],["Total Contributed",`$${totalContributed.toLocaleString()}`,"#c97b2e"],["Borrow Eligible",`$${eligibleBorrow.toLocaleString()}`,"#2e7d6e"]].map(([l,v,c])=>(
                  <div key={l} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:10,padding:"12px 16px",flex:1,minWidth:90}}><div style={{fontSize:10,color:"#555",textTransform:"uppercase",marginBottom:5}}>{l}</div><div style={{fontSize:16,fontWeight:700,color:c}}>{v}</div></div>
                ))}
              </div>
              <div style={{fontSize:11,color:"#555"}}>Extra capital is logged by admin. Reserve contributions are added automatically when a payment is missed and refunded at end of cycle.</div>
            </div>
            {myExtra.length>0?(
              <div>
                <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:10}}>Capital History</div>
                {myExtra.map(e=>(
                  <div key={e.id} style={{background:"#1c1c1c",border:`1px solid ${e.note==="reserve_contribution"?"rgba(46,125,110,.2)":"rgba(123,63,140,.2)"}`,borderRadius:10,padding:"12px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:e.note==="reserve_contribution"?"#2e7d6e":"#7B3F8C"}}>+${parseFloat(e.amount).toLocaleString()}</div>
                      <div style={{fontSize:10,color:"#555",marginTop:3}}>
                        {e.note==="reserve_contribution"?"🏦 Reserve contribution (refunded end of cycle)":`Week ${e.week_num} · ${e.logged_on}${e.note&&e.note!=="reserve_contribution"?` · ${e.note}`:""}`}
                      </div>
                    </div>
                    {e.note==="reserve_contribution"&&<span style={{fontSize:9,color:"#2e7d6e",background:"rgba(46,125,110,.1)",padding:"2px 6px",borderRadius:8}}>refundable</span>}
                  </div>
                ))}
              </div>
            ):<div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:24,textAlign:"center"}}><div style={{fontSize:12,color:"#444"}}>No extra capital contributions yet.</div></div>}
          </div>
        )}

        {subTab==="borrow"&&(
          <div>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px",marginBottom:14}}>
              <div style={{fontSize:11,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:14}}>Borrow Eligibility</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {[["Base Paid",`$${baseAmt.toLocaleString()}`,"#e8e0d4"],["Extra Capital",`$${totalExtra.toLocaleString()}`,"#7B3F8C"],["Total In",`$${totalContributed.toLocaleString()}`,"#c97b2e"],["Max Eligible",`$${eligibleBorrow.toLocaleString()}`,"#2e7d6e"],["Active Borrow",activeBorrow?`$${activeBorrow.amount}`:"None",activeBorrow?"#a83232":"#2e7d6e"]].map(([l,v,c])=>(
                  <div key={l} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:10,padding:"12px 16px",flex:1,minWidth:90}}><div style={{fontSize:10,color:"#555",textTransform:"uppercase",marginBottom:5}}>{l}</div><div style={{fontSize:16,fontWeight:700,color:c}}>{v}</div></div>
                ))}
              </div>
            </div>
            {activeBorrow&&<div style={{background:"rgba(168,50,50,.1)",border:"1px solid rgba(168,50,50,.25)",borderRadius:12,padding:"14px 18px",marginBottom:14}}><div style={{fontSize:12,fontWeight:600,color:"#a83232",marginBottom:6}}>Active Borrow</div><div style={{fontSize:11,color:"#888"}}>Amount: ${activeBorrow.amount} · {activeBorrow.borrowed_on} · Unpaid</div></div>}
            {pendingRequest&&<div style={{background:"rgba(201,123,46,.1)",border:"1px solid rgba(201,123,46,.25)",borderRadius:12,padding:"14px 18px",marginBottom:14}}><div style={{fontSize:12,fontWeight:600,color:"#c97b2e",marginBottom:6}}>⏳ Request Pending</div><div style={{fontSize:11,color:"#888"}}>Amount: ${pendingRequest.amount} · {pendingRequest.requested_on}</div></div>}
            {!activeBorrow&&!pendingRequest&&(
              <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px"}}>
                <div style={{fontSize:12,fontWeight:600,marginBottom:14}}>Request a Borrow</div>
                <div style={{fontSize:11,color:"#555",marginBottom:6}}>Amount (min $100, max ${eligibleBorrow})</div>
                <input type="number" value={borrowAmt} onChange={e=>setBorrowAmt(e.target.value)} placeholder="Enter amount" style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:13,marginBottom:10}}/>
                <div style={{fontSize:11,color:"#555",marginBottom:6}}>Reason (optional)</div>
                <textarea value={borrowReason} onChange={e=>setBorrowReason(e.target.value)} placeholder="Brief reason..." style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:13,marginBottom:10,minHeight:70,resize:"vertical"}}/>
                {borrowMsg&&<div style={{fontSize:11,color:borrowMsg.includes("submitted")?"#2e7d6e":"#a83232",marginBottom:10}}>{borrowMsg}</div>}
                <button onClick={submitBorrowRequest} disabled={borrowSaving} style={{width:"100%",background:"rgba(201,123,46,.2)",border:"1px solid rgba(201,123,46,.4)",borderRadius:8,padding:"11px",color:"#c97b2e",fontSize:13,fontWeight:600}}>{borrowSaving?"Submitting...":"Submit Request"}</button>
              </div>
            )}
            {myBorrows.length>0&&(
              <div style={{marginTop:14}}>
                <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:10}}>Borrow History</div>
                {myBorrows.map(b=>(
                  <div key={b.id} style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:10,padding:"12px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:13,fontWeight:600}}>${b.amount}</div><div style={{fontSize:10,color:"#555",marginTop:3}}>{b.borrowed_on}</div></div>
                    <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:b.repaid?"rgba(46,125,110,.15)":"rgba(168,50,50,.15)",color:b.repaid?"#2e7d6e":"#a83232",border:`1px solid ${b.repaid?"rgba(46,125,110,.3)":"rgba(168,50,50,.3)"}`}}>{b.repaid?"Repaid":"Outstanding"}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {subTab==="donate"&&(
          <div>
            <div style={{background:"#1c1c1c",border:"1px solid rgba(46,125,110,.25)",borderRadius:16,padding:24,marginBottom:14,textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:10}}>🤝</div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>Community Donation</div>
              <div style={{fontSize:12,color:"#555",lineHeight:1.6}}>Completely voluntary. Deducted from your draw. Change anytime.</div>
            </div>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,padding:"18px 20px"}}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
                {[["Base Draw",`$${baseDraw.toLocaleString()}`,"#e8e0d4"],["Donation",`$${donationAmt}`,"#2e7d6e"],["You Receive",`$${finalDraw.toLocaleString()}`,"#c97b2e"]].map(([l,v,c])=>(
                  <div key={l} style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:10,padding:"12px 16px",flex:1,minWidth:90}}><div style={{fontSize:10,color:"#555",textTransform:"uppercase",marginBottom:5}}>{l}</div><div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div></div>
                ))}
              </div>
              <div style={{fontSize:11,color:"#555",marginBottom:6}}>Donation amount (enter 0 to remove)</div>
              <input type="number" value={donationInput} onChange={e=>setDonationInput(e.target.value)} placeholder="e.g. 100" style={{width:"100%",background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"10px 12px",fontSize:14,textAlign:"center",marginBottom:10}}/>
              {donationMsg&&<div style={{fontSize:11,color:"#2e7d6e",marginBottom:10}}>{donationMsg}</div>}
              <button onClick={saveDonation} disabled={donationSaving} style={{width:"100%",background:"rgba(46,125,110,.2)",border:"1px solid rgba(46,125,110,.4)",borderRadius:8,padding:"11px",color:"#2e7d6e",fontSize:13,fontWeight:600}}>{donationSaving?"Saving...":"Save Donation"}</button>
            </div>
          </div>
        )}

        {subTab==="disclosure"&&<Disclosure/>}
        {subTab==="pin"&&<ChangePinForm currentPin={member.pin} onSave={saveMemberPin} onCancel={()=>setSubTab("my")}/>}
      </div>
    </div>
  );
}

function AdminView({members,allPayments,setAllPayments,borrows,setBorrows,donations,borrowRequests,setBorrowRequests,extraCapital,setExtraCapital,lateFees,setLateFees,cw,onLogout,adminPin,onAdminPinSaved,onMemberPinReset,sessionToken}){
  const[tab,setTab]=useState("overview");
  const[fmem,setFmem]=useState(null);
  const[borrowForm,setBorrowForm]=useState({});
  const[borrowMsg,setBorrowMsg]=useState({});
  const[sessionRemaining,setSessionRemaining]=useState(SESSION_TIMEOUT/1000);
  const[extraForm,setExtraForm]=useState({});
  const[extraMsg,setExtraMsg]=useState({});

  useEffect(()=>{const interval=setInterval(()=>{const sess=validateSession(sessionToken);if(!sess){onLogout();return;}const remaining=Math.ceil((sess.expires-Date.now())/1000);setSessionRemaining(remaining);if(remaining<=0)onLogout();},1000);return()=>clearInterval(interval);},[sessionToken]);
  const handleActivity=useCallback(()=>refreshSession(sessionToken),[sessionToken]);
  const extendSession=()=>setSessionRemaining(SESSION_TIMEOUT/1000);

  const stats=members.map((m,i)=>{
    const mp=allPayments[m.id]||{};
    const paid=WEEKS.filter(w=>w.n<=cw&&mp[w.n]).length;
    const due=Math.min(cw,NWEEKS);
    const numHands=m.hands||1;
    const myExtra=extraCapital.filter(e=>e.member_id===m.id);
    const totalExtra=myExtra.reduce((s,e)=>s+parseFloat(e.amount||0),0);
    const reserveContributions=myExtra.filter(e=>e.note==="reserve_contribution").reduce((s,e)=>s+parseFloat(e.amount||0),0);
    const totalContributed=paid*100+totalExtra;
    const myBorrows=borrows.filter(b=>b.member_id===m.id);
    const activeBorrow=myBorrows.find(b=>!b.repaid);
    const myDonation=donations.find(d=>d.member_id===m.id);
    const donationAmt=myDonation?parseFloat(myDonation.amount):0;
    const myLateWeeks=lateFees.filter(f=>f.member_id===m.id&&!f.paid);
    const debtInfo=calcMissedDebt(myLateWeeks);
    const baseDraw=numHands*3200;
    const finalDraw=baseDraw+totalExtra-donationAmt;
    return{...m,idx:i,paid,due,arr:due-paid,amt:paid*100,numHands,totalExtra,reserveContributions,totalContributed,eligibleBorrow:Math.floor(totalContributed*0.5),activeBorrow,donationAmt,myBorrows,myExtra,myLateWeeks,debtInfo,finalDraw,baseDraw};
  });

  const totCol=stats.reduce((s,m)=>s+m.amt,0);
  const totArr=stats.reduce((s,m)=>s+m.arr,0);
  const health=Math.round((stats.reduce((s,m)=>s+m.paid,0)/(members.length*cw))*100);
  const totDonations=donations.reduce((s,d)=>s+parseFloat(d.amount||0),0);
  const totExtra=extraCapital.filter(e=>e.note!=="reserve_contribution").reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const totReserve=extraCapital.filter(e=>e.note==="reserve_contribution").reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const potMap={};members.forEach(m=>{if(m.hand)potMap[m.hand]=m;});
  const pendingRequests=borrowRequests.filter(r=>r.status==="pending");

  const toggle=async(mid,wn)=>{
    handleActivity();
    const cur=allPayments[mid]?.[wn]||false;
    setAllPayments(p=>({...p,[mid]:{...p[mid],[wn]:!cur}}));
    await callApi('togglePayment',{memberId:mid,weekNum:wn,paid:!cur});
  };

  const toggleLate=async(mid,wn,isCurrentlyLate)=>{
    handleActivity();
    if(isCurrentlyLate){
      const fee=lateFees.find(f=>f.member_id===mid&&f.week_num===wn&&!f.paid);
      if(fee){
        await callApi('resolveLateFee',{feeId:fee.id});
        setLateFees(prev=>prev.map(f=>f.id===fee.id?{...f,paid:true}:f));
      }
    } else {
      const week=WEEKS.find(w=>w.n===wn);
      const lateStart=week?week.lateStart.toISOString():new Date().toISOString();
      const{lateData,extraData}=await callApi('insertLateFee',{memberId:mid,weekNum:wn,lateDate:lateStart});
      if(lateData)setLateFees(prev=>[...prev,lateData]);
      if(extraData)setExtraCapital(prev=>[...prev,extraData]);
    }
  };

  const logBorrow=async(mid)=>{
    handleActivity();
    const amt=parseFloat(borrowForm[mid]||0);
    if(!amt||amt<100){setBorrowMsg(p=>({...p,[mid]:"Min $100."}));return;}
    const m=stats.find(s=>s.id===mid);
    if(amt>m.eligibleBorrow){setBorrowMsg(p=>({...p,[mid]:`Max $${m.eligibleBorrow}.`}));return;}
    const{data}=await callApi('insertBorrow',{memberId:mid,amount:amt});
    if(data){setBorrows(prev=>[...prev,data]);setBorrowForm(p=>({...p,[mid]:""}));setBorrowMsg(p=>({...p,[mid]:"Logged."}));setTimeout(()=>setBorrowMsg(p=>({...p,[mid]:""})),3000);}
  };

  const logExtraCapital=async(mid)=>{
    handleActivity();
    const amt=parseFloat(extraForm[mid]?.amount||0);
    const note=extraForm[mid]?.note||"";
    const weekNum=parseInt(extraForm[mid]?.week||cw);
    if(!amt||amt<=0){setExtraMsg(p=>({...p,[mid]:"Enter valid amount."}));return;}
    const{data}=await callApi('insertExtraCapital',{memberId:mid,weekNum,amount:amt,note});
    if(data){setExtraCapital(prev=>[...prev,data]);setExtraForm(p=>({...p,[mid]:{}}));setExtraMsg(p=>({...p,[mid]:"Extra capital logged."}));setTimeout(()=>setExtraMsg(p=>({...p,[mid]:""})),3000);}
  };

  const toggleRepaid=async(borrowId,current)=>{
    handleActivity();
    await callApi('updateBorrow',{id:borrowId,repaid:!current,repaidOn:!current?new Date().toISOString().split("T")[0]:null});
    setBorrows(prev=>prev.map(b=>b.id===borrowId?{...b,repaid:!current}:b));
  };

  const reviewRequest=async(reqId,approved,memberId,amount)=>{
    handleActivity();
    const status=approved?"approved":"declined";
    const res=await callApi('reviewRequest',{reqId,status,memberId,amount});
    if(approved&&res.data)setBorrows(prev=>[...prev,res.data]);
    setBorrowRequests(prev=>prev.map(r=>r.id===reqId?{...r,status}:r));
  };

  const saveAdminPin=async(newPin)=>{await callApi('updateAdminPin',{pin:newPin});onAdminPinSaved(newPin);};

  const resetMemberPin=async(id)=>{
    const defaults=["1111","2222","3333","4444","5555","6666","7777","8888","9999","0000"];
    const defPin=defaults[id-1];
    await callApi('updateMemberPin',{id,pin:defPin});
    onMemberPinReset(id,defPin);
  };

  const card=(label,val,sub,color)=>(
    <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:12,padding:"14px 18px",flex:1,minWidth:120}}>
      <div style={{fontSize:10,color:"#555",textTransform:"uppercase",letterSpacing:".5px",marginBottom:5}}>{label}</div>
      <div style={{fontSize:22,fontWeight:700,lineHeight:1,color:color||"#e8e0d4"}}>{val}</div>
      {sub&&<div style={{fontSize:10,color:"#555",marginTop:4}}>{sub}</div>}
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#111"}} onClick={handleActivity} onKeyDown={handleActivity}>
      <SessionWarning remaining={sessionRemaining} onExtend={extendSession}/>
      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div><div style={{fontSize:16,fontWeight:700}}>💰 3200 Pardna — Admin</div><div style={{fontSize:10,color:"#555",marginTop:2}}>Jun 13 2025 → Jan 16 2026</div></div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {pendingRequests.length>0&&<span style={{background:"rgba(168,50,50,.2)",color:"#a83232",border:"1px solid rgba(168,50,50,.3)",borderRadius:20,padding:"4px 10px",fontSize:11}}>⚠️ {pendingRequests.length}</span>}
          <span style={{background:"rgba(201,123,46,.15)",color:"#c97b2e",border:"1px solid rgba(201,123,46,.3)",borderRadius:20,padding:"4px 12px",fontSize:11}}>Week {cw}</span>
          <button onClick={onLogout} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:8,color:"#555",fontSize:11,padding:"4px 10px"}}>Logout</button>
        </div>
      </div>

      <div style={{background:"#181818",borderBottom:"1px solid #2a2a2a",display:"flex",padding:"0 20px",overflowX:"auto"}}>
        {["overview","payments","capital","borrows","donations","requests","schedule","members","disclosure","settings"].map(t=>(
          <button key={t} onClick={()=>{setTab(t);handleActivity();}} style={{background:"none",border:"none",borderBottom:`2px solid ${tab===t?"#c97b2e":"transparent"}`,color:tab===t?"#c97b2e":"#555",fontSize:12,padding:"12px 14px",whiteSpace:"nowrap",textTransform:"capitalize",position:"relative"}}>

          <div style={{overflowX:"auto"}}>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,overflow:"hidden",minWidth:750}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 60px 80px 80px 60px 70px 80px 80px 75px",padding:"10px 18px",borderBottom:"1px solid #2a2a2a",fontSize:10,color:"#555",textTransform:"uppercase"}}>
                <span>Member</span><span>Hand</span><span>Deposit</span><span>Draw Date</span><span>Paid</span><span>Extra</span><span>Reserve</span><span>Final Draw</span><span>Status</span>
              </div>
              {stats.map(m=>{const dw=m.hand?WEEKS[m.hand-1]:null;return(
                <div key={m.id} style={{display:"grid",gridTemplateColumns:"1fr 60px 80px 80px 60px 70px 80px 80px 75px",padding:"12px 18px",alignItems:"center",borderBottom:"1px solid #1a1a1a"}}>
                  <div style={{display:"flex",alignItems:"center",gap:9}}><Av name={m.name} idx={m.idx} size={30}/><span style={{fontSize:13}}>{m.name}</span></div>
                  <HBadge hand={m.hand}/>
                  <span style={{fontSize:11,color:"#666"}}>{dw?dw.date:"—"}</span>
                  <span style={{fontSize:11,color:"#c97b2e"}}>{dw?dw.drawDate:"—"}</span>
                  <span style={{fontSize:13}}>{m.paid}<span style={{color:"#444"}}>/{m.due}</span></span>
                  <span style={{fontSize:13,color:"#7B3F8C"}}>${(m.totalExtra-m.reserveContributions).toLocaleString()}</span>
                  <span style={{fontSize:13,color:"#2e7d6e"}}>${m.reserveContributions.toLocaleString()}</span>
                  <span style={{fontSize:13,color:"#c97b2e"}}>${(m.finalDraw+m.reserveContributions).toLocaleString()}</span>
                  <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:m.arr>0?"rgba(168,50,50,.15)":"rgba(46,125,110,.15)",color:m.arr>0?"#a83232":"#2e7d6e",border:`1px solid ${m.arr>0?"rgba(168,50,50,.3)":"rgba(46,125,110,.3)"}`}}>{m.arr>0?`${m.arr} behind`:"current"}</span>
                </div>
              );})}
            </div>
          </div>
        )}

        {tab==="disclosure"&&<Disclosure/>}

        {tab==="settings"&&(
          <div style={{maxWidth:500}}>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,marginBottom:16,overflow:"hidden"}}>
              <div style={{padding:"14px 20px",borderBottom:"1px solid #2a2a2a",fontSize:13,fontWeight:600}}>🔐 Change Admin PIN</div>
              <ChangePinForm currentPin={adminPin} onSave={saveAdminPin} onCancel={()=>{}}/>
            </div>
            <div style={{background:"#1c1c1c",border:"1px solid #2a2a2a",borderRadius:14,overflow:"hidden"}}>
              <div style={{padding:"14px 20px",borderBottom:"1px solid #2a2a2a",fontSize:13,fontWeight:600}}>👥 Reset Member PINs</div>
              <div style={{padding:"8px 0"}}>
                {members.map((m,i)=>(
                  <div key={m.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 20px",borderBottom:"1px solid #1a1a1a"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}><Av name={m.name} idx={i} size={30}/><span style={{fontSize:13}}>{m.name}</span></div>
                    <button onClick={()=>resetMemberPin(m.id)} style={{background:"rgba(168,50,50,.15)",border:"1px solid rgba(168,50,50,.3)",borderRadius:8,color:"#a83232",fontSize:11,padding:"5px 12px"}}>Reset to default</button>
                  </div>
                ))}
              </div>
              <div style={{padding:"10px 20px",fontSize:10,color:"#444"}}>Resetting returns member PIN to their default.</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const[members,setMembers]=useState([]);
  const[allPayments,setAllPayments]=useState({});
  const[borrows,setBorrows]=useState([]);
  const[donations,setDonations]=useState([]);
  const[borrowRequests,setBorrowRequests]=useState([]);
  const[extraCapital,setExtraCapital]=useState([]);
  const[lateFees,setLateFees]=useState([]);
  const[adminPin,setAdminPin]=useState("1234");
  const[role,setRole]=useState(null);
  const[currentMember,setCurrentMember]=useState(null);
  const[loading,setLoading]=useState(true);
  const[loadError,setLoadError]=useState(null);
  const[sessionToken,setSessionToken]=useState(null);
  const cw=useMemo(getCurWeek,[]);

  useEffect(()=>{
    async function load(){
      const d=await callApi('load');
      setMembers(d.members||[]);
      const pm={};(d.payments||[]).forEach(r=>{if(!pm[r.member_id])pm[r.member_id]={};pm[r.member_id][r.week_num]=r.paid;});
      setAllPayments(pm);
      if(d.adminSettings)setAdminPin(d.adminSettings.pin);
      setBorrows(d.borrows||[]);
      setDonations(d.donations||[]);
      setBorrowRequests(d.borrowRequests||[]);
      setExtraCapital(d.extraCapital||[]);
      setLateFees(d.lateFees||[]);
    }catch(e){console.error('Load error:',e);setLoadError(String(e));}
    setLoading(false);
    }
    load();
  },[]);

  const handleLogin=(r,m)=>{const token=createSession(r,m);setSessionToken(token);setRole(r);setCurrentMember(m);};
  const handleLogout=()=>{destroySession();setSessionToken(null);setRole(null);setCurrentMember(null);};
  const handleMemberPin=(id,newPin)=>{setMembers(prev=>prev.map(m=>m.id===id?{...m,pin:newPin}:m));if(currentMember?.id===id)setCurrentMember(prev=>({...prev,pin:newPin}));};
  const handleMemberPinReset=(id,defPin)=>setMembers(prev=>prev.map(m=>m.id===id?{...m,pin:defPin}:m));

  const handleDonationUpdate=async(memberId,amount,existingId)=>{
    const res=await callApi('upsertDonation',{memberId,amount,existingId});
    if(existingId){setDonations(prev=>prev.map(d=>d.id===existingId?{...d,amount}:d));}
    else if(amount>0&&res.data){setDonations(prev=>[...prev,res.data]);}
  };

  const handleBorrowRequest=async(memberId,amount,reason)=>{
    const{data}=await callApi('insertBorrowRequest',{memberId,amount,reason});
    if(data)setBorrowRequests(prev=>[...prev,data]);
  };

  if(loading)return<Loading/>;
  if(loadError)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#111",padding:20}}><div style={{background:"#1c1c1c",border:"1px solid #a83232",borderRadius:12,padding:24,maxWidth:500,width:"100%"}}><div style={{color:"#a83232",fontWeight:700,marginBottom:12}}>Load Error</div><div style={{fontSize:11,color:"#888",wordBreak:"break-all"}}>{loadError}</div></div></div>;
  if(!role)return<Login members={members} adminPin={adminPin} onLogin={handleLogin}/>;
  if(role==="member"){
    const mp=allPayments[currentMember.id]||{};
    return<MemberView member={currentMember} payments={mp} borrows={borrows} donations={donations}
      borrowRequests={borrowRequests} extraCapital={extraCapital} lateFees={lateFees}
      cw={cw} onLogout={handleLogout} onPinSaved={handleMemberPin}
      onDonationUpdate={handleDonationUpdate} onBorrowRequest={handleBorrowRequest}
      sessionToken={sessionToken}/>;
  }
  if(role==="admin")return<AdminView members={members} allPayments={allPayments} setAllPayments={setAllPayments}
    borrows={borrows} setBorrows={setBorrows} donations={donations} borrowRequests={borrowRequests}
    setBorrowRequests={setBorrowRequests} extraCapital={extraCapital} setExtraCapital={setExtraCapital}
    lateFees={lateFees} setLateFees={setLateFees} cw={cw} onLogout={handleLogout}
    adminPin={adminPin} onAdminPinSaved={setAdminPin} onMemberPinReset={handleMemberPinReset}
    sessionToken={sessionToken}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
